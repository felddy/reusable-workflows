---
name: Renovate

# Dual-trigger housekeeping workflow (docs/v5/plan.md, D10): the
# schedule runs it in this repository, and workflow_call serves
# consumers' trigger-only stubs — both paths run this same file.
#
# Runs self-hosted Renovate against the calling repository. What gets
# updated is governed entirely by the caller's .github/renovate.json
# (here: `# renovate:` annotated tool pins that Dependabot's
# github-actions ecosystem cannot see, via custom regex managers only,
# so Renovate never overlaps with Dependabot). The caller provides the
# App id in the RENOVATE_APP_ID repository variable and the private key
# in the RENOVATE_PRIVATE_KEY secret (stubs pass `secrets: inherit`).

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: 23 */6 * * * # four times a day, offset from the build cron
  workflow_dispatch:
    inputs:
      dry-run:
        default: false
        description: Log what would happen without creating branches or PRs
        required: false
        type: boolean
      log-level:
        default: info
        description: Renovate log level
        options:
          - debug
          - info
        required: false
        type: choice
  workflow_call:
    inputs:
      dry-run:
        default: false
        description: Log what would happen without creating branches or PRs
        required: false
        type: boolean
      log-level:
        default: info
        description: Renovate log level (info or debug)
        required: false
        type: string
      allowed-commands:
        default: ""
        description: >-
          JSON array of anchored regexes permitting the caller's
          postUpgradeTasks commands; empty uses this repository's own
          command list
        required: false
        type: string

concurrency:
  # Only one Renovate run at a time; a second scheduled run would race
  # the first on branch creation and rebasing. This block also applies
  # when the file is called: github.workflow evaluates to the CALLER's
  # workflow name, so runs serialize per caller — and a stub declaring
  # the same group deadlocks parent against child
  # (felddy/foundryvtt-docker run 41203604569). Stubs must not declare
  # a concurrency group.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    # A blocked or refused connection makes the token step retry for ~49
    # minutes; fail fast so the next scheduled run can recover. The
    # budget covers pulling the full Renovate image (~2 GB).
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # tag=v2.22.3
        with:
          egress-policy: block
          # This list must cover every datasource that any caller's
          # renovate.json uses: a blocked registry surfaces to Renovate
          # as ECONNREFUSED, which aborts the caller's entire run
          # (npm: registry.npmjs.org, node-version: nodejs.org).
          # RENOVATE_EXIT_CODE_FOR_ERRORS below turns such aborts into
          # job failures instead of silent green runs.
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            index.docker.io:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: Generate a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # tag=v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Scope the installation token to what Renovate needs here;
          # workflows: write is required because the tracked version pins
          # live inside workflow files, and vulnerability-alerts: read lets
          # Renovate prioritize updates that fix Dependabot alerts.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Run Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # tag=v46.3.10
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The full image ships python and uv, which postUpgradeTasks
          # need (the slim default image has neither).
          renovate-version: full
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          # Only operate on this repository; the repository-level config at
          # .github/renovate.json controls what gets updated.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The config is committed, so skip onboarding PRs.
          RENOVATE_ONBOARDING: "false"
          # Commit via the GitHub API as the App: this produces
          # GitHub-verified (signed) commits that satisfy the development
          # ruleset's required-signatures rule.
          RENOVATE_PLATFORM_COMMIT: enabled
          # postUpgradeTasks commands are blocked unless they match one of
          # these anchored regexes. Callers pass their own list via the
          # allowed-commands input; the fallback is this repository's own
          # commands — keep it in sync with .github/renovate.json.
          RENOVATE_ALLOWED_COMMANDS: >-
            ${{ inputs.allowed-commands ||
            '["^python3 -m pip install --user pyyaml==6\\.0\\.3$",
            "^python3 tools/merge_precommit\\.py
            lint-config/pre-commit-base\\.yaml \\.pre-commit-overlay\\.yaml
            --output \\.pre-commit-config\\.yaml$"]' }}
          # A repository run that ends in a known error state (for
          # example an external host error) exits non-zero and fails
          # this job; without it the action exits 0 and an aborted run
          # looks green.
          RENOVATE_EXIT_CODE_FOR_ERRORS: "true"
          RENOVATE_DRY_RUN: ${{ inputs.dry-run == true && 'full' || null }}
