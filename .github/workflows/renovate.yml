---
name: Renovate

# Dual-trigger housekeeping workflow (docs/v5/plan.md, D10): the
# schedule runs it in this repository, and workflow_call serves
# consumers' trigger-only stubs — both paths run this same file.
#
# Runs self-hosted Renovate against the calling repository. What gets
# updated is governed entirely by the caller's .github/renovate.json
# (here: `# renovate:` annotated tool pins that Dependabot's
# github-actions ecosystem cannot see, via custom regex managers only,
# so Renovate never overlaps with Dependabot). The caller provides the
# App id in the RENOVATE_APP_ID repository variable and the private key
# in the RENOVATE_PRIVATE_KEY secret (stubs pass `secrets: inherit`).

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: 23 */6 * * * # four times a day, offset from the build cron
  workflow_dispatch:
    inputs:
      dry-run:
        default: false
        description: Log what would happen without creating branches or PRs
        required: false
        type: boolean
      log-level:
        default: info
        description: Renovate log level
        options:
          - debug
          - info
        required: false
        type: choice
  workflow_call:
    inputs:
      dry-run:
        default: false
        description: Log what would happen without creating branches or PRs
        required: false
        type: boolean
      log-level:
        default: info
        description: Renovate log level (info or debug)
        required: false
        type: string

concurrency:
  # Only one Renovate run at a time; a second scheduled run would race
  # the first on branch creation and rebasing. This block also applies
  # when the file is called: github.workflow evaluates to the CALLER's
  # workflow name, so runs serialize per caller — and a stub declaring
  # the same group deadlocks parent against child
  # (felddy/foundryvtt-docker run 41203604569). Stubs must not declare
  # a concurrency group.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    # A blocked or refused connection makes the token step retry for ~49
    # minutes; fail fast so the next scheduled run can recover.
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # tag=v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            ghcr.io:443
            github.com:443
            index.docker.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443

      - name: Generate a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # tag=v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Scope the installation token to what Renovate needs here;
          # workflows: write is required because the tracked version pins
          # live inside workflow files, and vulnerability-alerts: read lets
          # Renovate prioritize updates that fix Dependabot alerts.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # tag=v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          # Only operate on this repository; the repository-level config at
          # .github/renovate.json controls what gets updated.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The config is committed, so skip onboarding PRs.
          RENOVATE_ONBOARDING: "false"
          # Commit via the GitHub API as the App: this produces
          # GitHub-verified (signed) commits that satisfy the development
          # ruleset's required-signatures rule.
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_DRY_RUN: ${{ inputs.dry-run == true && 'full' || null }}
