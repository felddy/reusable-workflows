---
name: Container Retag Workflow

# This reusable workflow reconciles floating tags (latest, release, MAJOR,
# MAJOR.MINOR, prerelease) with the current state of a GitHub release,
# WITHOUT rebuilding anything: it repoints the floating tags at the digest
# the release's semver tag already references. Under immutable releases the
# only post-publish edits are metadata (notes, prerelease flag, latest
# marker), so `release: edited` needs exactly this and never a rebuild. It
# also gives "promote an older release to latest" a correct, build-free path.

# Permissions are set at the job level; default to none at workflow level.
permissions: {}

# Tool Versions - Update these to bump tool versions across the workflow
env:
  # renovate: datasource=github-releases depName=google/go-containerregistry
  CRANE_VERSION: v0.22.1

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      image-name:
        description: Container image name without registry (e.g. owner/image)
        required: true
        type: string

      release-tag:
        description: Git tag of the release to reconcile (e.g. v1.2.3)
        required: true
        type: string

    secrets:
      private-package-token:
        description: >
          Token for private image access. Required permissions:
          packages:write. Defaults to GITHUB_TOKEN when absent.
        required: false

      private-package-username:
        description: >
          Username for private-package-token authentication. Defaults to
          github.repository_owner when absent.
        required: false

jobs:
  retag:
    name: Reconcile floating tags
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # tag=v2.22.2
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Log in to container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # tag=v4.7.0
        with:
          registry: ghcr.io
          username: ${{ secrets.private-package-token && (secrets.private-package-username || github.repository_owner) || github.actor }}
          password: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}

      - name: Install crane
        run: |
          curl -sSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin crane
          crane version

      - name: Reconcile floating tags
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each channel is pointed at its rightful OWNER computed from the
          # full release list — never blindly at the edited release. Editing
          # an old release therefore cannot roll a channel backward, and
          # demoting the latest release moves latest/release to the new
          # rightful owner.
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "Release tag ${RELEASE_TAG} is not semver; nothing to reconcile"
            exit 0
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"

          RELEASES=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '[.[] | select(.draft | not) | {tag: .tag_name, prerelease: .prerelease, created: .created_at}]' \
            | jq -s 'add')

          # Highest non-prerelease version matching a version-prefix regex
          stable_owner() {
            jq -r --arg re "$1" '
              [.[] | select(.prerelease | not) | .tag | sub("^v"; "") | select(test($re))] | .[]
            ' <<<"${RELEASES}" | sort -V | tail -n1
          }

          LATEST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name // empty' || true)
          PRERELEASE_OWNER=$(jq -r '[.[] | select(.prerelease)] | sort_by(.created) | last | .tag // empty' <<<"${RELEASES}")

          echo "## Floating tags reconciled" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          reconcile() {
            local channel="$1" owner_version="$2"
            if [[ -z "${owner_version}" ]]; then
              echo "Channel '${channel}': no eligible owner; leaving untouched"
              return
            fi
            local owner_ref="ghcr.io/${IMAGE_NAME}:${owner_version}"
            local owner_digest
            if ! owner_digest=$(crane digest "${owner_ref}"); then
              echo "::warning::Channel '${channel}': owner ${owner_version} has no published image; leaving untouched"
              return
            fi
            local existing
            existing=$(crane digest "ghcr.io/${IMAGE_NAME}:${channel}" 2>/dev/null || true)
            if [[ "${existing}" == "${owner_digest}" ]]; then
              echo "✓ ${channel} -> ${owner_version} (unchanged)"
              echo "- \`${channel}\` -> \`${owner_version}\` (unchanged)" >> $GITHUB_STEP_SUMMARY
            else
              crane tag "ghcr.io/${IMAGE_NAME}@${owner_digest}" "${channel}"
              echo "Repointed ${channel}: ${existing:-<absent>} -> ${owner_version} @ ${owner_digest}"
              echo "- \`${channel}\` -> \`${owner_version}\` @ \`${owner_digest}\`" >> $GITHUB_STEP_SUMMARY
            fi
          }

          reconcile "${MAJOR}" "$(stable_owner "^${MAJOR}\\.")"
          reconcile "${MAJOR}.${MINOR}" "$(stable_owner "^${MAJOR}\\.${MINOR}\\.")"
          if [[ -n "${LATEST_TAG}" ]]; then
            reconcile "release" "${LATEST_TAG#v}"
            reconcile "latest" "${LATEST_TAG#v}"
          fi
          if [[ -n "${PRERELEASE_OWNER}" ]]; then
            reconcile "prerelease" "${PRERELEASE_OWNER#v}"
          fi
