---
name: Container Retag Workflow

# This reusable workflow reconciles floating tags (latest, release, MAJOR,
# MAJOR.MINOR, prerelease) with the current state of a GitHub release,
# WITHOUT rebuilding anything: it repoints the floating tags at the digest
# the release's semver tag already references. Under immutable releases the
# only post-publish edits are metadata (notes, prerelease flag, latest
# marker), so `release: edited` needs exactly this and never a rebuild. It
# also gives "promote an older release to latest" a correct, build-free path.

# Permissions are set at the job level; default to none at workflow level.
permissions: {}

# Tool Versions - Update these to bump tool versions across the workflow
env:
  CRANE_VERSION: v0.21.1

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      image-name:
        description: Container image name without registry (e.g. owner/image)
        required: true
        type: string

      release-tag:
        description: Git tag of the release to reconcile (e.g. v1.2.3)
        required: true
        type: string

    secrets:
      private-package-token:
        description: >
          Token for private image access. Required permissions:
          packages:write. Defaults to GITHUB_TOKEN when absent.
        required: false

      private-package-username:
        description: >
          Username for private-package-token authentication. Defaults to
          github.repository_owner when absent.
        required: false

jobs:
  retag:
    name: Reconcile floating tags
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # tag=v2.22.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Log in to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # tag=v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.private-package-token && (secrets.private-package-username || github.repository_owner) || github.actor }}
          password: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}

      - name: Install crane
        run: |
          curl -sSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin crane
          crane version

      - name: Reconcile floating tags
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          SOURCE="ghcr.io/${IMAGE_NAME}:${VERSION}"

          if ! DIGEST=$(crane digest "${SOURCE}"); then
            echo "::error::No published image for ${SOURCE} — the release was never built, so there is nothing to reconcile"
            exit 1
          fi
          echo "Release image: ${SOURCE} @ ${DIGEST}"

          # Read the release's current state from the API so this works for
          # both release events and manual dispatch.
          RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")
          PRERELEASE=$(jq -r '.prerelease' <<<"${RELEASE_JSON}")
          LATEST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name // empty' || true)

          FLOATS=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            FLOATS+=(prerelease)
          else
            if [[ "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              FLOATS+=("${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" "${BASH_REMATCH[1]}")
            fi
            if [[ -n "${LATEST_TAG}" && "${LATEST_TAG}" == "${RELEASE_TAG}" ]]; then
              FLOATS+=(release latest)
            fi
          fi

          if [[ ${#FLOATS[@]} -eq 0 ]]; then
            echo "No floating tags apply to ${RELEASE_TAG}"
            exit 0
          fi

          {
            echo "## Floating tags reconciled"
            echo ""
            echo "**Image:** \`${SOURCE}\` @ \`${DIGEST}\`"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          for float in "${FLOATS[@]}"; do
            EXISTING=$(crane digest "ghcr.io/${IMAGE_NAME}:${float}" 2>/dev/null || true)
            if [[ "${EXISTING}" == "${DIGEST}" ]]; then
              echo "✓ ${float}: already points at ${DIGEST}"
              echo "- \`${float}\` (unchanged)" >> $GITHUB_STEP_SUMMARY
            else
              crane tag "${SOURCE}" "${float}"
              echo "Repointed ${float}: ${EXISTING:-<absent>} -> ${DIGEST}"
              echo "- \`${float}\` -> \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY
            fi
          done
