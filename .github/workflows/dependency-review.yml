---
name: Dependency Review

# Dual-trigger housekeeping workflow (docs/v5/plan.md, D10): the
# pull_request trigger runs it in this repository, and workflow_call
# serves consumers' trigger-only stubs — both paths run this same file.

on: # yamllint disable-line rule:truthy
  pull_request:
  workflow_call:

# Permissions are set at the job level; default to none at workflow level.
permissions: {}

jobs:
  # The job id is the status-check context required by the development
  # ruleset (here and in consumers); a display name would change it.
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # tag=v2.22.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # tag=v5.0.0
