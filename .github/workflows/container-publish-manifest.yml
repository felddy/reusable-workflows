---
name: Container Publish Manifest Workflow

# This reusable workflow assembles a multi-arch manifest from per-platform
# digests uploaded by container-build.yml, then attests and signs the manifest.
# It owns all manifest assembly, attestation, and signing logic.

# Permissions are set at the job level; default to none at workflow level.
permissions: {}

# Tool Versions - Keep in sync with container-build.yml
env:
  CRANE_VERSION: v0.21.1

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      image-name:
        description: Container image name without registry (e.g. owner/image)
        required: true
        type: string

      platforms:
        description: >
          JSON array of platforms to include in the manifest
          (e.g. '["linux/amd64","linux/arm64"]').
        required: true
        type: string

      image-tags:
        description: >
          Full image tags to apply (newline-separated registry/name:tag
          entries), produced by container-pipeline.yml's metadata job.
        required: true
        type: string

      push:
        description: Push manifest to registry. Set false for dry-run.
        required: false
        type: boolean
        default: true

      immutable-tag-pattern:
        description: >
          Tags matching this regex are immutable-class: once published they
          are never repointed to a different digest (GHCR has no native tag
          immutability, so the guard is enforced here). Floating tags
          (latest, release, edge, MAJOR, MAJOR.MINOR, branch and pr tags)
          intentionally do not match the default.
        required: false
        type: string
        default: ^v?[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$

      force-tag-overwrite:
        description: >
          Override the immutable-tag guard and repoint existing
          immutable-class tags. Emergency use only.
        required: false
        type: boolean
        default: false

    secrets:
      private-package-token:
        description: >
          Token for private image manifest push. Required permissions:
          packages:write, packages:read. Defaults to GITHUB_TOKEN when absent.
        required: false

      private-package-username:
        description: >
          Username for private-package-token authentication. Required when the
          PAT owner differs from github.repository_owner (e.g. org repos using
          a service account PAT). Defaults to github.repository_owner when absent.
        required: false

    outputs:
      image-digest:
        description: Final multi-arch manifest digest (sha256:...)
        value: ${{ jobs.publish.outputs.image-digest }}

jobs:
  # Assemble multi-arch manifest from per-platform digests, then attest and sign
  publish:
    name: Publish Manifest
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
      # actions/attest@v4 records artifact storage metadata
      artifact-metadata: write

    outputs:
      image-digest: ${{ steps.manifest-digest.outputs.digest }}
      has-sbom: ${{ steps.check-attestations.outputs.has_sbom }}

    env:
      PREDICATE_TYPE_PROVENANCE: https://slsa.dev/provenance/v1
      PREDICATE_TYPE_SBOM: https://spdx.dev/Document/v2.3
      PREDICATE_TYPE_BUILD_ENV: https://github.com/felddy/reusable-workflows/build-environment/v1

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # tag=v2.22.1
        with:
          disable-sudo: true
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Derive image slug
        id: slugs
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          IMAGE_SLUG=$(echo "${IMAGE_NAME}" | tr '/' '-')
          echo "image-slug=${IMAGE_SLUG}" >> $GITHUB_OUTPUT
          echo "Image slug: ${IMAGE_SLUG}"

      # Download all platform digests for this image by exact artifact name.
      # actions/download-artifact only supports exact-name downloads for a single
      # static artifact; its pattern input cannot be scoped tightly enough to avoid
      # matching sibling images with a shared slug prefix (e.g. "owner-image" vs
      # "owner-image-hid"). gh run download --name loops over exact names instead.
      - name: Download digest artifacts
        env:
          PLATFORMS_JSON: ${{ inputs.platforms }}
          IMAGE_SLUG: ${{ steps.slugs.outputs.image-slug }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/digests
          for platform in $(echo "${PLATFORMS_JSON}" | jq -r '.[]'); do
            PLATFORM_SLUG=$(echo "${platform}" | tr '/' '-')
            ARTIFACT_NAME="digests-${IMAGE_SLUG}-${PLATFORM_SLUG}"
            echo "Downloading artifact: ${ARTIFACT_NAME}"
            gh run download "${{ github.run_id }}" \
              --repo "${{ github.repository }}" \
              --name "${ARTIFACT_NAME}" \
              --dir "/tmp/digests/${ARTIFACT_NAME}"
          done

      - name: Validate digests
        run: |
          echo "Digest artifacts found:"
          ls -la /tmp/digests/
          COUNT=$(ls /tmp/digests/ | wc -l)
          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::No digest artifacts found in /tmp/digests — build artifacts may be missing"
            exit 1
          fi
          echo "Found ${COUNT} platform digest(s)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # tag=v4.4.0

      - name: Log in to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # tag=v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.private-package-token && (secrets.private-package-username || github.repository_owner) || github.actor }}
          password: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}

      - name: Install crane
        run: |
          CRANE_VERSION="${{ env.CRANE_VERSION }}"
          curl -sSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin crane
          crane version

      - name: Create and push multi-arch manifest
        id: create-manifest
        env:
          IMAGE_TAGS: ${{ inputs.image-tags }}
          IMAGE_NAME: ${{ inputs.image-name }}
          DRY_RUN_FLAG: ${{ inputs.push == false && '--dry-run' || '' }}
        run: |
          # Build --tag flags from newline-separated image-tags
          TAG_FLAGS=""
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            TAG_FLAGS="${TAG_FLAGS} --tag ${tag}"
          done <<< "${IMAGE_TAGS}"

          # Build digest references from hex files inside per-platform subdirs.
          # Validate each filename matches ^[a-f0-9]{64}$ to catch corrupt artifacts.
          DIGEST_REFS=""
          for subdir in /tmp/digests/*/; do
            HEX=$(ls "${subdir}" | grep -E '^[a-f0-9]{64}$' || true)
            if [[ -z "${HEX}" ]]; then
              echo "::error::No valid sha256 digest file found in ${subdir}"
              exit 1
            fi
            if [[ $(echo "${HEX}" | wc -l) -gt 1 ]]; then
              echo "::error::Multiple digest files found in ${subdir}: ${HEX}"
              exit 1
            fi
            DIGEST_REFS="${DIGEST_REFS} ghcr.io/${IMAGE_NAME}@sha256:${HEX}"
          done

          echo "Desired tags:"
          echo "${IMAGE_TAGS}"
          echo ""
          echo "From digests:"
          echo "${DIGEST_REFS}"

          if [[ -n "${DRY_RUN_FLAG}" ]]; then
            # Dry-run: evaluate the full tag set without pushing anything.
            # shellcheck disable=SC2086
            docker buildx imagetools create ${DRY_RUN_FLAG} ${TAG_FLAGS} ${DIGEST_REFS}
          else
            # Push the manifest under a mutable staging tag only; the final
            # tags are applied by the guard step so immutable-class tags are
            # never silently repointed.
            # shellcheck disable=SC2086
            docker buildx imagetools create --tag "ghcr.io/${IMAGE_NAME}:staging" ${DIGEST_REFS}
          fi

      - name: Extract manifest digest
        id: manifest-digest
        if: inputs.push
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          DIGEST=$(crane digest "ghcr.io/${IMAGE_NAME}:staging")
          if [[ -z "$DIGEST" ]]; then
            echo "::error::Failed to extract manifest digest from staging tag"
            exit 1
          fi

          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "Manifest digest: ${DIGEST}"

      - name: Apply tags with immutable-tag guard
        if: inputs.push
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_TAGS: ${{ inputs.image-tags }}
          IMMUTABLE_PATTERN: ${{ inputs.immutable-tag-pattern }}
          FORCE: ${{ inputs.force-tag-overwrite }}
          NEW_DIGEST: ${{ steps.manifest-digest.outputs.digest }}
        run: |
          # GHCR has no native tag immutability; enforce it here. A tag whose
          # existing digest already matches is a no-op (idempotent re-runs);
          # repointing an immutable-class tag requires force-tag-overwrite.
          while IFS= read -r full_tag; do
            [[ -z "${full_tag}" ]] && continue
            BARE="${full_tag##*:}"

            if [[ "${BARE}" =~ ${IMMUTABLE_PATTERN} ]]; then
              EXISTING=$(crane digest "${full_tag}" 2>/dev/null || true)
              if [[ "${EXISTING}" == "${NEW_DIGEST}" ]]; then
                echo "✓ ${BARE}: already points at ${NEW_DIGEST} (no-op)"
                continue
              fi
              if [[ -n "${EXISTING}" && "${FORCE}" != "true" ]]; then
                echo "::error::Tag '${BARE}' is immutable-class and already exists with digest ${EXISTING}; refusing to repoint it to ${NEW_DIGEST}. Set force-tag-overwrite to override."
                exit 1
              fi
              if [[ -n "${EXISTING}" ]]; then
                echo "::warning::Overwriting immutable-class tag '${BARE}' (force-tag-overwrite)"
              fi
            fi

            crane tag "ghcr.io/${IMAGE_NAME}:staging" "${BARE}"
            echo "Tagged ${BARE} -> ${NEW_DIGEST}"
          done <<< "${IMAGE_TAGS}"

      - name: Install ORAS
        if: inputs.push
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # tag=v2.0.2

      # Re-publishing the same digests (e.g. a scheduled edge run with a warm
      # cache) yields the same index digest; skip attestations that already
      # exist so they do not accumulate on the manifest.
      - name: Check attestation existence
        id: check-attestations
        if: inputs.push
        timeout-minutes: 3
        env:
          IMAGE_REF: ghcr.io/${{ inputs.image-name }}@${{ steps.manifest-digest.outputs.digest }}
          PLATFORMS_JSON: ${{ inputs.platforms }}
        run: |
          echo "Checking for existing attestations on index..."
          echo "Image reference: $IMAGE_REF"

          json="$(oras discover --format json "${IMAGE_REF}")"

          # Returns "true" or "false" (as text)
          has_pred() {
            local predicate="$1"
            jq -r --arg p "${predicate}" '
              any(.referrers[]?; .annotations["dev.sigstore.bundle.predicateType"] == $p)
            ' <<<"${json}"
          }

          # One SBOM attestation is expected per platform. Comparing against
          # the platform count means a partially-attested index (one platform
          # failed in an earlier run) is re-attested rather than skipped.
          SBOM_COUNT=$(jq -r --arg p "${PREDICATE_TYPE_SBOM}" '
            [.referrers[]? | select(.annotations["dev.sigstore.bundle.predicateType"] == $p)] | length
          ' <<<"${json}")
          PLATFORM_COUNT=$(jq -r 'length' <<<"${PLATFORMS_JSON}")
          if [[ "${SBOM_COUNT}" -ge "${PLATFORM_COUNT}" ]]; then
            HAS_SBOM=true
          else
            HAS_SBOM=false
          fi
          echo "SBOM attestations: ${SBOM_COUNT}/${PLATFORM_COUNT}"

          echo "has_provenance=$(has_pred "${PREDICATE_TYPE_PROVENANCE}")" >> "${GITHUB_OUTPUT}"
          echo "has_sbom=${HAS_SBOM}" >> "${GITHUB_OUTPUT}"
          echo "has_build_env=$(has_pred "${PREDICATE_TYPE_BUILD_ENV}")" >> "${GITHUB_OUTPUT}"

      - name: Attest manifest (SLSA provenance)
        if: inputs.push && steps.check-attestations.outputs.has_provenance != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # tag=v4.2.2
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.manifest-digest.outputs.digest }}
          push-to-registry: true

      - name: Attest manifest (build environment)
        if: inputs.push && steps.check-attestations.outputs.has_build_env != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # tag=v4.2.2
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.manifest-digest.outputs.digest }}
          predicate-type: ${{ env.PREDICATE_TYPE_BUILD_ENV }}
          predicate: |
            {
              "runner": "${{ runner.os }}",
              "workflow": "${{ github.workflow }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}"
            }
          push-to-registry: true

      - name: Install cosign
        if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # tag=v4.1.2

      - name: Sign manifest (keyless)
        if: inputs.push
        env:
          IMAGE_REF: ghcr.io/${{ inputs.image-name }}@${{ steps.manifest-digest.outputs.digest }}
        run: |
          echo "Signing manifest: ${IMAGE_REF}"
          cosign sign --yes "${IMAGE_REF}"
          echo "✅ Manifest signed successfully"

      - name: Output manifest summary
        if: always()
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          DIGEST: ${{ steps.manifest-digest.outputs.digest }}
          IMAGE_TAGS: ${{ inputs.image-tags }}
        run: |
          echo "## Manifest Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${IMAGE_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE_TAGS}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Attest each platform's SBOM against the index digest so that
  # `gh attestation verify oci://<image>:<tag>` (which resolves to the index)
  # finds SBOM attestations. Platform-level SBOM attestations are created by
  # container-build.yml; this job re-targets the same documents.
  attest-index-sbom:
    name: Attest SBOM to index (${{ matrix.platform }})
    needs:
      - publish
    if: inputs.push && needs.publish.outputs.has-sbom != 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}

    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
      # actions/attest@v4 records artifact storage metadata
      artifact-metadata: write

    env:
      PREDICATE_TYPE_SBOM: https://spdx.dev/Document/v2.3

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # tag=v2.22.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Log in to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # tag=v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.private-package-token && (secrets.private-package-username || github.repository_owner) || github.actor }}
          password: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # tag=v4.1.2

      - name: Obtain platform SBOM
        id: sbom
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ secrets.private-package-token && (secrets.private-package-username
            || github.repository_owner) || github.actor }}
        run: |
          IMAGE_SLUG=$(echo "${IMAGE_NAME}" | tr '/' '-')
          PLATFORM_SLUG=$(echo "${PLATFORM}" | tr '/' '-')
          mkdir -p /tmp/sbom

          # Prefer the SBOM artifact from this run's build job. When the
          # build skipped SBOM generation (the platform image was already
          # attested in an earlier run), fall back to downloading the SBOM
          # attestation from the platform image itself.
          if gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "sbom-${IMAGE_SLUG}-${PLATFORM_SLUG}" \
            --dir /tmp/sbom; then
            SBOM_FILE=$(ls /tmp/sbom/*.spdx.json | head -n1)
            echo "Using SBOM artifact: ${SBOM_FILE}"
          else
            echo "SBOM artifact not found; extracting from platform attestation"
            gh run download "${{ github.run_id }}" \
              --repo "${{ github.repository }}" \
              --name "digests-${IMAGE_SLUG}-${PLATFORM_SLUG}" \
              --dir /tmp/digest
            HEX=$(ls /tmp/digest | grep -E '^[a-f0-9]{64}$' | head -n1)
            if [[ -z "${HEX}" ]]; then
              echo "::error::No digest artifact found for ${PLATFORM}"
              exit 1
            fi
            # GitHub attestations are stored as Sigstore bundles (statement
            # at .dsseEnvelope.payload); plain DSSE envelopes use .payload.
            cosign download attestation \
              --predicate-type "${PREDICATE_TYPE_SBOM}" \
              "ghcr.io/${IMAGE_NAME}@sha256:${HEX}" \
              | head -n1 | jq -r '.dsseEnvelope.payload // .payload' | base64 -d \
              | jq '.predicate' > /tmp/sbom/platform.spdx.json
            SBOM_FILE=/tmp/sbom/platform.spdx.json
          fi

          if ! jq -e '.spdxVersion' "${SBOM_FILE}" > /dev/null; then
            echo "::error::${SBOM_FILE} is not a valid SPDX document"
            exit 1
          fi
          echo "sbom-file=${SBOM_FILE}" >> "$GITHUB_OUTPUT"

      - name: Attest SBOM against index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # tag=v4.2.2
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ needs.publish.outputs.image-digest }}
          sbom-path: ${{ steps.sbom.outputs.sbom-file }}
          push-to-registry: true

  # Fail the pipeline unless the published image actually verifies: GitHub
  # attestations for provenance and SBOM, and the cosign keyless signature.
  verify:
    name: Verify attestations and signature
    needs:
      - publish
      - attest-index-sbom
    # attest-index-sbom is skipped when the index already carries SBOM
    # attestations; verification must still run in that case.
    if: |
      always() && inputs.push &&
      needs.publish.result == 'success' &&
      (needs.attest-index-sbom.result == 'success' ||
       needs.attest-index-sbom.result == 'skipped')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    env:
      IMAGE_REF: ghcr.io/${{ inputs.image-name }}@${{ needs.publish.outputs.image-digest }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # tag=v2.22.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Log in to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # tag=v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.private-package-token && (secrets.private-package-username || github.repository_owner) || github.actor }}
          password: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # tag=v4.1.2

      - name: Verify provenance attestation
        run: |
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://slsa.dev/provenance/v1
          echo "✅ provenance attestation verified"

      - name: Verify SBOM attestation
        run: |
          gh attestation verify "oci://${IMAGE_REF}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3
          echo "✅ SBOM attestation verified"

      - name: Verify cosign signature
        # The signing identity is the publish job of this reusable workflow,
        # so the expected certificate identity is the same for every caller
        # repository. Pin the full workflow path: a signature from any other
        # workflow in this repository must not satisfy the gate.
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/felddy/reusable-workflows/\.github/workflows/container-publish-manifest\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_REF}" > /dev/null
          echo "✅ cosign signature verified"

      - name: Output verification summary
        env:
          HAS_SBOM: ${{ needs.publish.outputs.has-sbom }}
        run: |
          echo "## Verification Passed ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMAGE_REF}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- SLSA provenance attestation (GitHub)" >> $GITHUB_STEP_SUMMARY
          echo "- SPDX SBOM attestation (GitHub)" >> $GITHUB_STEP_SUMMARY
          echo "- cosign keyless signature (Sigstore)" >> $GITHUB_STEP_SUMMARY
