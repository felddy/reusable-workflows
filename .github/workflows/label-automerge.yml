---
name: Label auto-merge PRs

on: # yamllint disable-line rule:truthy
  pull_request_target:
    types:
      - auto_merge_enabled
      - auto_merge_disabled

env:
  LABEL_NAME: "automerge :bell:"

jobs:
  add-remove-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Update label
        run: |
          if [[ "${EVENT_ACTION}" == "auto_merge_enabled" ]]; then
            gh pr edit "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --add-label "${LABEL_NAME}"
          elif [[ "${EVENT_ACTION}" == "auto_merge_disabled" ]]; then
            gh pr edit "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --remove-label "${LABEL_NAME}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
