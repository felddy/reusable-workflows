---
name: Lint

# This reusable workflow runs the configured pre-commit hooks on the
# repository.  It handles caching and installation of the hooks.
#
# uv provisions Python and a pinned pre-commit (pre-commit-version
# input), so a repository whose only Python artifact is
# .pre-commit-config.yaml lints with no extra files.  Repositories
# whose local hooks import project code can opt in to
# sync-project-deps, which installs the caller's test dependency group
# from uv.lock before the hooks run.

# Permissions are set at the job level; default to none at workflow level.
permissions: {}

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      go-version:
        default: "1.26"
        description: The version of Go to use.
        required: false
        type: string
      lint-config-ref:
        default: v6
        description: >
          Ref of felddy/reusable-workflows to read the central
          pre-commit base from when checking a generated
          .pre-commit-config.yaml. Only used when the caller has a
          .pre-commit-overlay.yaml.
        required: false
        type: string
      pre-commit-version:
        # renovate: datasource=pypi depName=pre-commit
        default: 4.7.0
        description: The version of pre-commit to use.
        required: false
        type: string
      python-version:
        default: "3.14"
        description: The version of Python to use.
        required: false
        type: string
      shfmt-version:
        # renovate: datasource=github-releases depName=mvdan/sh
        default: v3.14.1
        description: The version of shfmt (shell format) to use.
        required: false
        type: string
      sync-project-deps:
        default: false
        description: >
          Install the caller's test dependency group with uv before
          running the hooks, for repositories whose local hooks import
          project code. Requires a uv.lock and a test group under
          [dependency-groups] in pyproject.toml.
        required: false
        type: boolean

jobs:
  lint:
    # Checks out the source and runs pre-commit hooks.  Detects coding errors
    # and style deviations.
    name: Lint sources
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.23.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            files.pythonhosted.org:443
            github.com:443
            golang.org:443
            index.crates.io:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            pypi.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            static.crates.io:443
            sum.golang.org:443

      # We need the Go version and Go cache location for the actions/cache step,
      # so the Go installation must happen before that.
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: false

      - name: Store installed Go version
        id: go-version
        run: |
          echo version=$(go version | sed 's/^go version go\([0-9.]\+\) .*/\1/') >> $GITHUB_OUTPUT

      - name: Lookup Go cache directory
        id: go-cache
        run: |
          echo "dir=$(go env GOCACHE)" >> $GITHUB_OUTPUT

      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}

      # Local hooks that import project code (mypy-style) need the
      # caller's test dependency group on the PATH; every other hook
      # runs without touching project dependencies.
      - name: Sync project dependencies
        if: inputs.sync-project-deps
        run: |
          if [[ ! -f uv.lock ]]; then
            echo "::error::sync-project-deps is set but uv.lock is missing from the repository root."
            exit 1
          fi
          if [[ ! -f pyproject.toml ]]; then
            echo "::error::sync-project-deps is set but pyproject.toml is missing from the repository root."
            exit 1
          fi
          if ! python3 -c 'import pathlib, sys, tomllib; sys.exit("test" not in tomllib.loads(pathlib.Path("pyproject.toml").read_text()).get("dependency-groups", {}))'; then
            echo "::error::sync-project-deps is set but pyproject.toml defines no test group under [dependency-groups]."
            exit 1
          fi
          uv sync --frozen --only-group test
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      # uv's own package cache is handled by setup-uv.
      - name: Cache Go and pre-commit hook environments
        uses: actions/cache@v6.1.0
        env:
          BASE_CACHE_KEY: "${{ github.job }}-${{ runner.os }}-\
            py${{ inputs.python-version }}-\
            pc${{ inputs.pre-commit-version }}-\
            go${{ steps.go-version.outputs.version }}-"
        with:
          path: |
            ~/.cache/pre-commit
            ${{ steps.go-cache.outputs.dir }}
          key: "${{ env.BASE_CACHE_KEY }}\
            ${{ hashFiles('.pre-commit-config.yaml') }}"
          restore-keys: |
            ${{ env.BASE_CACHE_KEY }}

      - name: Install shfmt
        env:
          SHFMT_VERSION: ${{ inputs.shfmt-version }}
        run: go install "mvdan.cc/sh/v3/cmd/shfmt@${SHFMT_VERSION}"

      # pre-commit runs as a pinned uv tool rather than from a project
      # environment, so a consumer's lockfile cannot shift the linter
      # version; uvx reuses the cached tool environment across steps.
      - name: Set up pre-commit hook environments
        env:
          PRE_COMMIT_VERSION: ${{ inputs.pre-commit-version }}
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: uvx --python "${PYTHON_VERSION}" "pre-commit@${PRE_COMMIT_VERSION}" install-hooks

      - name: Run pre-commit on all files
        env:
          PRE_COMMIT_VERSION: ${{ inputs.pre-commit-version }}
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: uvx --python "${PYTHON_VERSION}" "pre-commit@${PRE_COMMIT_VERSION}" run --all-files

      # Repositories with a .pre-commit-overlay.yaml generate their
      # .pre-commit-config.yaml from the central base; a hand edit to
      # the generated file must fail lint. The two central files are
      # fetched raw rather than checked out: CodeQL flags a privileged
      # checkout at an input-controlled ref as a cache-poisoning vector.
      # This repository checks itself with its lint-config-check hook
      # instead (its base may be ahead of any released ref).
      - name: Check generated pre-commit config against the central base
        if: hashFiles('.pre-commit-overlay.yaml') != '' && github.repository != 'felddy/reusable-workflows'
        env:
          CENTRAL_RAW: https://raw.githubusercontent.com/felddy/reusable-workflows
          LINT_CONFIG_REF: ${{ inputs.lint-config-ref }}
        run: |
          # A repository may pin its lint base to an exact release with a
          # "# lint-base-version: vX.Y.Z" comment in its overlay (bumped
          # by Renovate, which regenerates the config in the same PR);
          # the floating input ref is the fallback. The pin must look
          # like a version tag so it cannot smuggle URL path segments.
          pin=$(sed -n 's/^# lint-base-version: *//p' .pre-commit-overlay.yaml | head -1)
          if printf '%s' "${pin}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            LINT_CONFIG_REF="${pin}"
          fi
          central=$(mktemp -d)
          trap 'rm -rf "${central}"' EXIT
          curl -fsSL --output "${central}/merge_precommit.py" \
            "${CENTRAL_RAW}/${LINT_CONFIG_REF}/tools/merge_precommit.py"
          curl -fsSL --output "${central}/pre-commit-base.yaml" \
            "${CENTRAL_RAW}/${LINT_CONFIG_REF}/lint-config/pre-commit-base.yaml"
          # merge_precommit.py needs PyYAML, which the runner's Python
          # does not guarantee; uv supplies it in an ephemeral
          # environment.
          uv run --no-project --with pyyaml python \
            "${central}/merge_precommit.py" \
            "${central}/pre-commit-base.yaml" \
            .pre-commit-overlay.yaml \
            --check .pre-commit-config.yaml
