---
name: Project Config Workflow

# This reusable workflow derives per-repository build configuration (version,
# image name, platform lists, standard build arguments) so callers don't need
# a local config workflow and Makefile plumbing to produce these values.

# Permissions are set at the job level; default to none at workflow level.
permissions: {}

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      version-file:
        description: Path to the file containing the project version.
        required: false
        type: string
        default: version.txt

      image-name:
        description: Container image name (without registry).
        required: false
        type: string
        default: ${{ github.repository }}

      platforms:
        description: Platforms to build (JSON array string).
        required: false
        type: string
        default: '["linux/amd64","linux/arm64"]'

      test-platforms:
        description: Platforms to test (JSON array string).
        required: false
        type: string
        default: '["linux/amd64"]'

    outputs:
      version:
        description: Project version read from version-file
        value: ${{ jobs.config.outputs.version }}

      image-name:
        description: Container image name (without registry)
        value: ${{ inputs.image-name }}

      platforms:
        description: Platforms to build (JSON array string)
        value: ${{ inputs.platforms }}

      test-platforms:
        description: Platforms to test (JSON array string)
        value: ${{ inputs.test-platforms }}

      build-args:
        description: >
          Standard build arguments (newline-separated KEY=VALUE), currently
          CONTAINER_VERSION from the version file.
        value: ${{ jobs.config.outputs.build-args }}

jobs:
  config:
    name: Configuration
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      build-args: ${{ steps.version.outputs.build-args }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # tag=v2.22.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      - name: Read version
        id: version
        env:
          VERSION_FILE: ${{ inputs.version-file }}
        run: |
          if [[ ! -f "${VERSION_FILE}" ]]; then
            echo "::error::Version file not found: ${VERSION_FILE}"
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < "${VERSION_FILE}")
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Version file is empty: ${VERSION_FILE}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

          delimiter="$(openssl rand -hex 8)"
          {
            echo "build-args<<${delimiter}"
            echo "CONTAINER_VERSION=${VERSION}"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
