---
name: Container Rescan Workflow

# This reusable workflow re-evaluates published container images for new
# vulnerabilities WITHOUT rebuilding or pulling the images: it downloads the
# SBOM attestations produced at build time, scans them with Grype, refreshes
# the vulnerability attestation on each platform digest, and fails the run
# when findings exceed the severity threshold. Scheduled daily by callers, it
# replaces daily full rebuilds as the CVE-freshness signal.
#
# Grype (not Trivy) scans the SBOMs: the build attests syft-generated SPDX
# documents, which carry no OPERATING_SYSTEM element, and Trivy skips every
# OS package when it cannot identify the distro ("Detected OS: none"). Grype
# reads the distro from the package purls and matches the full document.

# Permissions are set at the job level; default to none at workflow level.
permissions: {}

# Tool Versions - Update these to bump tool versions across the workflow
env:
  # renovate: datasource=github-releases depName=google/go-containerregistry
  CRANE_VERSION: v0.22.1
  # renovate: datasource=github-releases depName=anchore/grype
  GRYPE_VERSION: v0.121.0

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      image-name:
        description: Container image name without registry (e.g. owner/image)
        required: true
        type: string

      tags:
        description: >
          JSON array of tags to rescan (e.g. '["latest","edge"]'). Each tag
          is resolved to its multi-arch index and every platform digest is
          scanned.
        required: false
        type: string
        default: '["latest"]'

      scan-severity:
        description: >
          Fail on vulnerabilities at or above this severity (e.g.
          CRITICAL,HIGH — the lowest listed severity becomes the threshold).
          Set to empty string to report without failing.
        required: false
        type: string
        default: CRITICAL,HIGH

      vex-file:
        description: >
          Path to an OpenVEX document in the caller repository; passed to
          Grype so known-not-exploitable findings are suppressed.
        required: false
        type: string
        default: ""

      upload-scan-results:
        description: Upload SARIF results to the GitHub Security tab.
        required: false
        type: boolean
        default: true

    secrets:
      private-package-token:
        description: >
          Token for private image access. Required permissions:
          packages:write (to refresh the vulnerability attestation).
          Defaults to GITHUB_TOKEN when absent.
        required: false

      private-package-username:
        description: >
          Username for private-package-token authentication. Defaults to
          github.repository_owner when absent.
        required: false

jobs:
  # Resolve each requested tag to its per-platform digests.
  resolve:
    name: Resolve tags to platform digests
    runs-on: ubuntu-latest

    permissions:
      packages: read

    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # tag=v2.22.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Log in to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # tag=v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.private-package-token && (secrets.private-package-username || github.repository_owner) || github.actor }}
          password: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}

      - name: Install crane
        run: |
          curl -sSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin crane
          crane version

      - name: Resolve platform digests
        id: resolve
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          TAGS_JSON: ${{ inputs.tags }}
        run: |
          # Collect entries in a file rather than a pipeline so a manifest
          # fetch failure for any tag fails the step instead of silently
          # producing a partial matrix.
          ENTRIES=$(mktemp)
          for tag in $(jq -r '.[]' <<<"${TAGS_JSON}"); do
            REF="ghcr.io/${IMAGE_NAME}:${tag}"
            echo "Resolving ${REF}"
            if ! manifest=$(crane manifest "${REF}"); then
              echo "::error::Failed to fetch manifest for ${REF}"
              exit 1
            fi
            jq -c --arg tag "${tag}" '
              .manifests[]?
              | select(.platform.os != null and .platform.os != "unknown")
              | {tag: $tag,
                 platform: (.platform.os + "/" + .platform.architecture
                   + (if .platform.variant then "/" + .platform.variant else "" end)),
                 digest: .digest}
            ' <<<"${manifest}" >> "${ENTRIES}"
          done
          MATRIX=$(jq -s -c '{include: .}' "${ENTRIES}")

          COUNT=$(jq '.include | length' <<<"${MATRIX}")
          if [[ "${COUNT}" -eq 0 ]]; then
            echo "::error::No platform digests resolved — are the tags multi-arch indexes?"
            exit 1
          fi
          echo "Resolved ${COUNT} platform digest(s)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  # Scan each platform digest from its attested SBOM; no image pull needed.
  scan:
    name: Rescan ${{ matrix.tag }} ${{ matrix.platform }}
    needs: resolve
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      # actions/attest@v4 records artifact storage metadata
      artifact-metadata: write
      security-events: write

    env:
      PREDICATE_TYPE_SBOM: https://spdx.dev/Document/v2.3
      PREDICATE_TYPE_VULN: https://cosign.sigstore.dev/attestation/vuln/v1
      IMAGE_REF: ghcr.io/${{ inputs.image-name }}@${{ matrix.digest }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # tag=v2.22.1
        with:
          disable-sudo: true
          egress-policy: audit

      # The checkout provides the caller's scan-policy file: the VEX document
      # named by vex-file — keeping rescan verdicts consistent with
      # build-time scans.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      - name: Log in to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # tag=v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.private-package-token && (secrets.private-package-username || github.repository_owner) || github.actor }}
          password: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # tag=v4.1.2

      - name: Install Grype
        run: |
          curl -sSL "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VERSION#v}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin grype
          grype version

      - name: Derive slugs
        id: slugs
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ matrix.tag }}
        run: |
          IMAGE_SLUG=$(echo "${IMAGE_NAME}" | tr '/' '-')
          PLATFORM_SLUG=$(echo "${PLATFORM}" | tr '/' '-')
          echo "image-slug=${IMAGE_SLUG}" >> "$GITHUB_OUTPUT"
          echo "platform-slug=${PLATFORM_SLUG}" >> "$GITHUB_OUTPUT"
          # Include the image slug: multiple images rescanned in one
          # repository must not share SARIF categories, or their analyses
          # overwrite each other in code scanning.
          echo "sarif-category=rescan-${IMAGE_SLUG}-${TAG}-${PLATFORM_SLUG}" >> "$GITHUB_OUTPUT"

      - name: Download SBOM attestation
        run: |
          # The SBOM was attested at build time; scanning it avoids pulling
          # the image or any base layers. GitHub attestations are stored as
          # Sigstore bundles (statement at .dsseEnvelope.payload); plain DSSE
          # envelopes carry it at .payload.
          cosign download attestation \
            --predicate-type "${PREDICATE_TYPE_SBOM}" \
            "${IMAGE_REF}" \
            | head -n1 | jq -r '.dsseEnvelope.payload // .payload' | base64 -d \
            | jq '.predicate' > sbom.spdx.json

          if ! jq -e '.spdxVersion' sbom.spdx.json > /dev/null; then
            echo "::error::No SPDX SBOM attestation found for ${IMAGE_REF}"
            exit 1
          fi
          echo "SBOM: $(jq -r '.name // "unnamed"' sbom.spdx.json), $(jq '.packages | length' sbom.spdx.json) packages"

      - name: Scan SBOM
        id: scan-gate
        continue-on-error: true
        env:
          SCAN_SEVERITY: ${{ inputs.scan-severity }}
          VEX_FILE: ${{ inputs.vex-file }}
        run: |
          # One scan emits every output: the SARIF for code scanning, the
          # JSON for the refreshed vulnerability attestation, and the table
          # for the log. --only-fixed mirrors the build-time
          # --ignore-unfixed policy: findings without an available fix
          # (including distro won't-fix) are reported nowhere and never gate.
          ARGS=(--only-fixed -o sarif=rescan.sarif -o json=rescan.json -o table)
          if [[ -n "${VEX_FILE}" ]]; then
            ARGS+=(--vex "${VEX_FILE}")
          fi
          # Grype takes a single threshold that implies all higher
          # severities, so the lowest severity listed becomes the threshold.
          if [[ -n "${SCAN_SEVERITY}" ]]; then
            FAIL_ON=""
            for level in negligible low medium high critical; do
              if grep -qiw "${level}" <<<"${SCAN_SEVERITY}"; then
                FAIL_ON="${level}"
                break
              fi
            done
            if [[ -z "${FAIL_ON}" ]]; then
              echo "::error::scan-severity '${SCAN_SEVERITY}' contains no recognized severity"
              exit 1
            fi
            ARGS+=(--fail-on "${FAIL_ON}")
          fi
          grype "${ARGS[@]}" sbom:sbom.spdx.json

      - name: Upload SARIF to GitHub Security
        if: inputs.upload-scan-results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # tag=codeql-bundle-v4.39.0
        with:
          category: ${{ steps.slugs.outputs.sarif-category }}
          sarif_file: rescan.sarif

      - name: Refresh vulnerability attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # tag=v4.2.2
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ matrix.digest }}
          predicate-type: ${{ env.PREDICATE_TYPE_VULN }}
          predicate-path: rescan.json
          push-to-registry: true
        continue-on-error: true

      - name: Fail if vulnerabilities found
        if: steps.scan-gate.outcome == 'failure'
        env:
          TAG: ${{ matrix.tag }}
          PLATFORM: ${{ matrix.platform }}
          SCAN_SEVERITY: ${{ inputs.scan-severity }}
        run: |
          echo "::error::Rescan of ${TAG} (${PLATFORM}) found vulnerabilities above threshold: ${SCAN_SEVERITY}"
          exit 1

      - name: Output rescan summary
        if: always()
        env:
          TAG: ${{ matrix.tag }}
          PLATFORM: ${{ matrix.platform }}
          GATE_OUTCOME: ${{ steps.scan-gate.outcome }}
        run: |
          echo "## Rescan: \`${TAG}\` ${PLATFORM}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMAGE_REF}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Severity gate:** \`${GATE_OUTCOME}\`" >> $GITHUB_STEP_SUMMARY
