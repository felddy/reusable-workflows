---
name: Build

on: # yamllint disable-line rule:truthy
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches:
      - develop
      - develop-*
  release:
    types:
      - published
  schedule:
    # Weekly image refresh (updates the edge tag). Daily CVE monitoring is
    # handled by _rescan.yml against the attested SBOMs; floating-tag
    # reconciliation after release edits is handled by _retag.yml.
    - cron: 0 10 * * 1 # Mondays at 10am
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# Grant write scopes per job; a workflow-level grant would hand every
# job (lint, diagnostics, config) a write-capable token it never needs.
permissions: {}

jobs:
  diagnostics:
    name: Diagnostics
    permissions:
      contents: read
    uses: ./.github/workflows/diagnostics.yml

  config:
    name: Config
    permissions:
      contents: read
    uses: ./.github/workflows/project-config.yml
    with:
      image-name: felddy/reusable-workflow
      platforms: >-
        ["linux/386","linux/amd64","linux/arm/v5","linux/arm/v6",
        "linux/arm/v7","linux/arm/v8","linux/arm64/v8",
        "linux/ppc64le","linux/riscv64","linux/s390x"]
      test-platforms: '["linux/amd64","linux/arm64/v8"]'

  lint:
    name: Lint
    permissions:
      contents: read
    uses: ./.github/workflows/common-lint.yml

  pipeline:
    name: Pipeline (${{ matrix.flavor }})
    needs:
      - diagnostics
      - config
      - lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: public
            image-suffix: ""
            private: false
            mirror: true
            readme: true
          - flavor: private
            image-suffix: -hid
            private: true
            mirror: false
            readme: false
    permissions:
      actions: read
      # contents: write lets the pipeline record image digests in release
      # notes; every other pipeline job narrows back to contents: read.
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    uses: ./.github/workflows/container-pipeline.yml
    with:
      image-name: ${{ needs.config.outputs.image-name }}${{ matrix.image-suffix }}
      platforms: ${{ needs.config.outputs.platforms }}
      test-platforms: ${{ needs.config.outputs.test-platforms }}
      private: ${{ matrix.private }}
      scan-severity: CRITICAL,HIGH
      mirror-on-release: ${{ matrix.mirror }}
      publish-readme-on-release: ${{ matrix.readme }}
    secrets:
      private-package-token: ${{ secrets.PRIVATE_PACKAGE_TOKEN }}
      docker-hub-username: ${{ secrets.DOCKER_USERNAME }}
      docker-hub-password: ${{ secrets.DOCKER_PASSWORD }}

  ci-gate:
    name: CI Gate
    needs:
      - diagnostics
      - config
      - lint
      - pipeline
    if: always()
    permissions: {}
    uses: ./.github/workflows/ci-gate.yml
    with:
      needs-json: ${{ toJSON(needs) }}
