---
name: Build

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - "**"
  pull_request:
  release:
    types:
      - edited
      - published
  schedule:
    - cron: 0 10 * * * # everyday at 10am
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  diagnostics:
    name: Diagnostics
    uses: ./.github/workflows/diagnostics.yml

  config:
    name: Config
    uses: ./.github/workflows/_config.yml

  lint:
    name: Lint
    uses: ./.github/workflows/common-lint.yml

  build:
    name: Build and Publish Container
    needs:
      - config
      - lint
    # Skip on pull requests to save time, only build test platform
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/container-build.yml
    with:
      platforms: ${{ needs.config.outputs.platforms_csv }}
      image-name: ${{ needs.config.outputs.image_name }}
      registry: ghcr.io
      visibility: public
      context: .
      dockerfile: ./Dockerfile
      enable-attestations: true
      enable-sbom: true
      enable-signing: false  # ✅ Available - Task 2.5 complete (set to true to enable keyless signing)
      enable-scanning: true  # ✅ Enabled - Task 2.2 complete
      scan-severity: CRITICAL,HIGH
      kubernetes-labels: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  build-private:
    name: Build and Publish Container Private
    needs:
      - config
      - lint
    # Skip on pull requests to save time, only build test platform
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/container-build.yml
    with:
      platforms: ${{ needs.config.outputs.platforms_csv }}
      image-name: ${{ needs.config.outputs.image_name }}-private
      registry: ghcr.io
      visibility: private
      context: .
      dockerfile: ./Dockerfile
      enable-attestations: true
      enable-sbom: true
      enable-signing: false
      enable-scanning: true
      scan-severity: CRITICAL,HIGH
      kubernetes-labels: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
      private-package-token: ${{ secrets.PRIVATE_PACKAGE_TOKEN }}

  build-pr:
    name: Build Container (PR)
    needs:
      - config
      - lint
    # Only build test platform for PRs
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/container-build.yml
    with:
      platforms: ${{ needs.config.outputs.test_platform }}
      image-name: ${{ needs.config.outputs.image_name }}
      registry: ghcr.io
      visibility: private
      context: .
      dockerfile: ./Dockerfile
      enable-attestations: false
      enable-sbom: false
      enable-signing: false
      enable-scanning: true  # ✅ Enabled for PRs with relaxed threshold
      scan-severity: CRITICAL  # Only fail on critical for PRs
      kubernetes-labels: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  mirror-to-dockerhub:
    name: Mirror images to DockerHub
    needs:
      - build
      - config
    if: github.event_name == 'release' && !github.event.release.prerelease
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/container-mirror.yml
    with:
      image_name: ${{ needs.config.outputs.image_name }}
      image_tag_names: ${{ needs.build.outputs.image-tags }}
      target_registry: docker.io
    secrets:
      registry_password: ${{ secrets.DOCKER_PASSWORD }}
      registry_username: ${{ secrets.DOCKER_USERNAME }}

  publish-readme:
    name: Publish docs to DockerHub
    needs:
      - build
      - config
    if: github.event_name == 'release'
    uses: ./.github/workflows/dockerhub-description.yml
    with:
      image_name: ${{ needs.config.outputs.image_name }}
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
