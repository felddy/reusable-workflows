---
name: Build

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - "**"
  pull_request:
  release:
    types:
      - edited
      - published
  schedule:
    - cron: 0 10 * * * # everyday at 10am
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  diagnostics:
    name: Diagnostics
    uses: ./.github/workflows/diagnostics.yml

  config:
    name: Config
    uses: ./.github/workflows/_config.yml

  lint:
    name: Lint
    uses: ./.github/workflows/common-lint.yml

  build:
    name: Build and Publish Container
    needs:
      - config
    uses: ./.github/workflows/container-build.yml
    with:
      platforms: ${{ needs.config.outputs.platforms }}
      image-name: ${{ needs.config.outputs.image_name }}
      context: .
      dockerfile: ./Dockerfile
      scan-severity: CRITICAL,HIGH

  build-private:
    name: Build and Publish Container Private
    needs:
      - config
    uses: ./.github/workflows/container-build.yml
    with:
      platforms: ${{ needs.config.outputs.platforms }}
      image-name: ${{ needs.config.outputs.image_name }}-hid
      context: .
      dockerfile: ./Dockerfile
      scan-severity: CRITICAL,HIGH
    secrets:
      private-package-token: ${{ secrets.PRIVATE_PACKAGE_TOKEN }}

  test:
    name: Test Container
    needs:
      - config
      - build
    uses: ./.github/workflows/container-test.yml
    with:
      image-name: ${{ needs.config.outputs.image_name }}
      platforms: ${{ needs.config.outputs.test_platform }}

  test-private:
    name: Test Container Private
    needs:
      - config
      - build-private
    uses: ./.github/workflows/container-test.yml
    with:
      image-name: ${{ needs.config.outputs.image_name }}-hid
      platforms: ${{ needs.config.outputs.test_platform }}
    secrets:
      registry-token: ${{ secrets.PRIVATE_PACKAGE_TOKEN }}

  publish-manifest:
    name: Publish Manifest
    needs:
      - config
      - build
      - test
    uses: ./.github/workflows/container-publish-manifest.yml
    with:
      image-name: ${{ needs.config.outputs.image_name }}
      platforms: ${{ needs.config.outputs.platforms }}

  publish-manifest-private:
    name: Publish Manifest Private
    needs:
      - config
      - build-private
      - test-private
    uses: ./.github/workflows/container-publish-manifest.yml
    with:
      image-name: ${{ needs.config.outputs.image_name }}-hid
      platforms: ${{ needs.config.outputs.platforms }}
    secrets:
      private-package-token: ${{ secrets.PRIVATE_PACKAGE_TOKEN }}

  check:
    name: Check Quality Gates
    needs:
      - lint
      - diagnostics
      - test
      - test-private
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write  # Required to cancel workflow runs
    steps:
      - name: Verify quality gates passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LINT_RESULT="${{ needs.lint.result }}"
          DIAGNOSTICS_RESULT="${{ needs.diagnostics.result }}"
          TEST_RESULT="${{ needs.test.result }}"
          TEST_PRIVATE_RESULT="${{ needs.test-private.result }}"

          FAILED=false

          if [[ "$LINT_RESULT" != "success" ]]; then
            echo "::error::Lint failed with status: $LINT_RESULT"
            FAILED=true
          fi

          if [[ "$DIAGNOSTICS_RESULT" != "success" ]]; then
            echo "::error::Diagnostics failed with status: $DIAGNOSTICS_RESULT"
            FAILED=true
          fi

          if [[ "$TEST_RESULT" != "success" && "$TEST_RESULT" != "skipped" ]]; then
            echo "::error::Test failed with status: $TEST_RESULT"
            FAILED=true
          fi

          if [[ "$TEST_PRIVATE_RESULT" != "success" && "$TEST_PRIVATE_RESULT" != "skipped" ]]; then
            echo "::error::Test (private) failed with status: $TEST_PRIVATE_RESULT"
            FAILED=true
          fi

          if [[ "$FAILED" == "true" ]]; then
            echo "::error::Quality gates failed"

            # Cancel the workflow run
            echo "Cancelling workflow run..."
            gh run cancel ${{ github.run_id }}
            gh run watch ${{ github.run_id }}

            exit 1
          fi

          echo "✅ All quality gates passed"

  mirror-to-dockerhub:
    name: Mirror images to DockerHub
    needs:
      - publish-manifest
      - config
      - check
    if: github.event_name == 'release' && !github.event.release.prerelease
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/container-mirror.yml
    with:
      image_name: ${{ needs.config.outputs.image_name }}
      image_tag_names: ${{ needs.publish-manifest.outputs.image-tag-names }}
      target_registry: docker.io
    secrets:
      target-registry-username: ${{ secrets.DOCKER_USERNAME }}
      target-registry-password: ${{ secrets.DOCKER_PASSWORD }}

  publish-readme:
    name: Publish docs to DockerHub
    needs:
      - publish-manifest
      - config
      - check
    if: github.event_name == 'release' && !github.event.release.prerelease
    uses: ./.github/workflows/dockerhub-description.yml
    with:
      image_name: ${{ needs.config.outputs.image_name }}
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
