---
name: Build

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - "**"
  pull_request:
  release:
    types:
      - edited
      - published
  schedule:
    - cron: 0 10 * * * # everyday at 10am
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  diagnostics:
    name: Diagnostics
    uses: ./.github/workflows/diagnostics.yml

  config:
    name: Config
    uses: ./.github/workflows/_config.yml

  lint:
    name: Lint
    uses: ./.github/workflows/common-lint.yml

  build:
    name: Build and Publish Container
    needs:
      - config
    # Skip on pull requests to save time, only build test platform
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/container-build.yml
    with:
      platforms: ${{ needs.config.outputs.platforms }}
      image-name: ${{ needs.config.outputs.image_name }}
      context: .
      dockerfile: ./Dockerfile
      scan-severity: CRITICAL,HIGH

  build-private:
    name: Build and Publish Container Private
    needs:
      - config
    # Skip on pull requests to save time, only build test platform
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/container-build.yml
    with:
      platforms: ${{ needs.config.outputs.platforms }}
      image-name: ${{ needs.config.outputs.image_name }}-hid
      context: .
      dockerfile: ./Dockerfile
      scan-severity: CRITICAL,HIGH
    secrets:
      private-package-token: ${{ secrets.PRIVATE_PACKAGE_TOKEN }}

  build-pr:
    name: Build Container (PR)
    needs:
      - config
    # Only build test platform for PRs
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/container-build.yml
    with:
      platforms: ${{ needs.config.outputs.test_platform }}
      image-name: ${{ needs.config.outputs.image_name }}
      context: .
      dockerfile: ./Dockerfile
      scan-severity: CRITICAL  # Only fail on critical for PRs

  check:
    name: Check Quality Gates
    needs:
      - lint
      - diagnostics
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write  # Required to cancel workflow runs
    steps:
      - name: Verify quality gates passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LINT_RESULT="${{ needs.lint.result }}"
          DIAGNOSTICS_RESULT="${{ needs.diagnostics.result }}"

          if [[ "$LINT_RESULT" != "success" ]] || [[ "$DIAGNOSTICS_RESULT" != "success" ]]; then
            echo "::error::Quality gates failed"

            if [[ "$LINT_RESULT" != "success" ]]; then
              echo "::error::Lint failed with status: $LINT_RESULT"
            fi

            if [[ "$DIAGNOSTICS_RESULT" != "success" ]]; then
              echo "::error::Diagnostics failed with status: $DIAGNOSTICS_RESULT"
            fi

            # Cancel the workflow run
            echo "Cancelling workflow run..."
            gh run cancel ${{ github.run_id }}
            gh run watch ${{ github.run_id }}

            exit 1
          fi

          echo "✅ All quality gates passed"

  mirror-to-dockerhub:
    name: Mirror images to DockerHub
    needs:
      - build
      - config
      - check
    if: github.event_name == 'release' && !github.event.release.prerelease
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/container-mirror.yml
    with:
      image_name: ${{ needs.config.outputs.image_name }}
      image_tag_names: ${{ needs.build.outputs.image-tags }}
      target_registry: docker.io
    secrets:
      registry_password: ${{ secrets.DOCKER_PASSWORD }}
      registry_username: ${{ secrets.DOCKER_USERNAME }}

  publish-readme:
    name: Publish docs to DockerHub
    needs:
      - build
      - config
      - check
    if: github.event_name == 'release'
    uses: ./.github/workflows/dockerhub-description.yml
    with:
      image_name: ${{ needs.config.outputs.image_name }}
    secrets:
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
      docker_username: ${{ secrets.DOCKER_USERNAME }}
