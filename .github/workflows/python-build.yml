---
name: Python Build

# Reusable pipeline for a uv-managed Python library: test the source
# tree across a caller-supplied interpreter matrix, build the sdist and
# wheel once, then prove the built wheel passes the same test suite in
# a clean environment. The caller's uv.lock is authoritative: syncs use
# --locked, so a stale lockfile fails fast instead of floating.
#
# Coverage reporting is optional: coverage-service "coveralls" uploads
# per-interpreter runs in parallel mode and closes them in a finish
# job; "none" skips the service while still running pytest under
# coverage locally.

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      python-versions:
        description: >
          JSON array of interpreter versions to test against, e.g.
          '["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]'.
        required: true
        type: string
      coverage-service:
        default: coveralls
        description: Coverage upload service ("coveralls" or "none").
        required: false
        type: string
      dependency-group:
        default: test
        description: uv dependency group that carries the test tooling.
        required: false
        type: string

# Permissions are set at the job level; default to none at workflow level.
permissions: {}

jobs:
  test:
    name: test source - py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # tag=v2.22.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            coveralls.io:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # tag=v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project with its test group
        env:
          DEPENDENCY_GROUP: ${{ inputs.dependency-group }}
        run: uv sync --locked --group "${DEPENDENCY_GROUP}"

      - name: Run tests
        # Coverage comes from the repository's own pytest configuration.
        run: uv run --no-sync pytest

      - name: Upload coverage to Coveralls
        if: inputs.coverage-service == 'coveralls'
        env:
          COVERALLS_FLAG_NAME: py${{ matrix.python-version }}
          COVERALLS_PARALLEL: "true"
          COVERALLS_SERVICE_NAME: github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-sync coveralls

  coveralls-finish:
    if: inputs.coverage-service == 'coveralls'
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # tag=v2.22.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            coveralls.io:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # tag=v10.3.2

      - name: Close the parallel coverage session
        env:
          COVERALLS_SERVICE_NAME: github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx coveralls --finish

  build:
    name: build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # tag=v2.22.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # tag=v10.3.2
        with:
          enable-cache: true

      - name: Build the sdist and wheel
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  test-build:
    name: test built wheel - py${{ matrix.python-version }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # tag=v2.22.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # tag=v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba63b55e8a124e7c56687f73e79b4ed # tag=v8.0.2
        with:
          name: dist
          path: dist

      - name: Install the wheel with the test group into a clean venv
        env:
          DEPENDENCY_GROUP: ${{ inputs.dependency-group }}
        run: |
          uv venv wheel-env
          uv pip install --python wheel-env --group "${DEPENDENCY_GROUP}" \
            dist/*.whl

      - name: Run the test suite against the installed wheel
        # The src layout keeps the working tree off sys.path, so imports
        # resolve to the installed wheel, not the source.
        run: wheel-env/bin/python -m pytest
