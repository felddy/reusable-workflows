---
name: Publish README

# This reusable workflow publishes the description of a container image to
# DockerHub.

# Permissions are set at the job level; default to none at workflow level.
permissions: {}

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      # Required inputs
      image-name:
        description: The container image name
        required: true
        type: string
      # Optional inputs
      file-path:
        default: ./README.md
        description: The path to the file to publish
        required: false
        type: string
    secrets:
      docker-hub-password:
        description: The password for the DockerHub account
        required: true
      docker-hub-username:
        description: The username for the DockerHub account
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: DockerHub Description
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          password: ${{ secrets.docker-hub-password }}
          readme-filepath: ${{ inputs.file-path }}
          repository: ${{ inputs.image-name }}
          short-description: ${{ github.event.repository.description }}
          username: ${{ secrets.docker-hub-username }}
