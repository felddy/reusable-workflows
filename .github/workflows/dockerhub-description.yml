---
name: Publish README

# This reusable workflow publishes the description of a container image to
# DockerHub.

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      # Required inputs
      image_name:
        description: The container image name
        required: true
        type: string
      # Optional inputs
      filepath:
        default: ./README.md
        description: The path to the file to publish
        required: false
        type: string
    secrets:
      docker_password:
        description: The password for the DockerHub account
        required: true
      docker_username:
        description: The username for the DockerHub account
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # tag=v2.14.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # tag=v6.0.1

      - name: DockerHub Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # tag=v5.0.0
        with:
          password: ${{ secrets.docker_password }}
          readme-filepath: ${{ inputs.filepath }}
          repository: ${{ inputs.image_name }}
          short-description: ${{ github.event.repository.description }}
          username: ${{ secrets.docker_username }}
