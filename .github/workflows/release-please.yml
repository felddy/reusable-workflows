---
name: Release Please

# Reusable workflow: maintains the release PR from conventional commits
# (version bump plus changelog) and publishes the GitHub release when that
# PR merges. The release should be published with a personal access token:
# events created with GITHUB_TOKEN do not trigger workflows, so a release
# published that way would never run the caller's build pipeline. The PAT's
# identity is a repository admin, whose ruleset bypass permits creating the
# semver tag.
#
# The caller's job must grant:
#   permissions:
#     contents: write
#     pull-requests: write

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      advance-floating-major:
        default: false
        description: >
          Advance the floating major tag (for example, v5) to the release
          commit when a full semver release is published. Intended for
          repositories whose consumers pin a major tag, such as reusable
          workflows or actions.
        required: false
        type: boolean
      config-file:
        default: release-please-config.json
        description: Path to the release-please configuration file.
        required: false
        type: string
      manifest-file:
        default: .release-please-manifest.json
        description: Path to the release-please manifest file.
        required: false
        type: string
    outputs:
      releases_created:
        description: Whether one or more releases were created.
        value: ${{ jobs.release-please.outputs.releases_created }}
      sha:
        description: Commit SHA that was released.
        value: ${{ jobs.release-please.outputs.sha }}
      tag_name:
        description: Tag name of the created release.
        value: ${{ jobs.release-please.outputs.tag_name }}
    secrets:
      release-please-token:
        description: >
          Personal access token used to publish the release. Falls back to
          GITHUB_TOKEN so the release PR keeps working if the secret is
          absent — but a release published in fallback mode does NOT
          trigger other workflows (no build pipeline runs).
        required: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    permissions:
      # contents: write advances the floating major tag with GITHUB_TOKEN;
      # forward tag moves are fast-forward and permitted by the major-tag
      # ruleset without bypass. Both scopes also let the action operate in
      # its degraded GITHUB_TOKEN fallback mode (see the token secret).
      contents: write
      pull-requests: write

    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # tag=v2.22.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # tag=v5.0.0
        with:
          token: ${{ secrets.release-please-token || secrets.GITHUB_TOKEN }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      - name: Advance floating major tag
        if: >
          inputs.advance-floating-major
          && steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          # Only full semver releases move the floating major tag.
          if [[ ! "${TAG_NAME}" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Prerelease ${TAG_NAME}; floating tag unchanged"
            exit 0
          fi
          MAJOR="v${BASH_REMATCH[1]}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${MAJOR}" > /dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR}" \
              -f sha="${RELEASE_SHA}" -F force=true > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${MAJOR}" -f sha="${RELEASE_SHA}" > /dev/null
          fi
          echo "Floating tag ${MAJOR} -> ${RELEASE_SHA} (${TAG_NAME})"
