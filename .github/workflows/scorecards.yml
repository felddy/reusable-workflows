---
name: Scorecards supply-chain security

# Dual-trigger housekeeping workflow (docs/v5/plan.md, D10): the native
# triggers run it in this repository, and workflow_call serves
# consumers' trigger-only stubs — both paths run this same file.
#
# The publish-results enforcement (ossf/scorecard-infra) shape-verifies
# the file named by the OIDC cert's job_workflow_ref — this file, for
# stub callers too — against an approved-actions allowlist: only uses:
# steps from checkout / upload-artifact / upload-sarif /
# scorecard-action / harden-runner / create-github-app-token, no env or
# defaults at any level, a single ubuntu-* runner, and id-token: write
# on this job alone. Keep any edits inside that shape;
# fail_on_publish_error surfaces a rejection as a failed run instead of
# a silent warning.

on: # yamllint disable-line rule:truthy
  # Only the caller's default branch is supported.
  branch_protection_rule:
  schedule:
    - cron: 43 4 * * 4
  push:
    branches:
      - develop
  workflow_dispatch:
  workflow_call:

# Permissions are set at the job level; default to none at workflow
# level. A global read-all here breaks stub callers at startup: a
# called workflow may not request more than the caller's job grants,
# and read-all asks for read on every scope.
permissions: {}

jobs:
  analysis:
    name: Scorecards analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Used to receive a badge.
      id-token: write
      # Needs for private repositories.
      contents: read
      actions: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # tag=v2.22.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            api.scorecard.dev:443
            api.securityscorecards.dev:443
            bestpractices.coreinfrastructure.org:443
            fulcio.sigstore.dev:443
            github.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            public.ecr.aws:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            www.bestpractices.dev:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # tag=v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # (Optional) Read-only PAT token. Uncomment the `repo_token` line below if:
          # - you want to enable the Branch-Protection check on a *public* repository, or
          # - you are installing Scorecards on a *private* repository
          # To create the PAT, follow the steps in https://github.com/ossf/scorecard-action#authentication-with-pat.
          # repo_token: ${{ secrets.SCORECARD_READ_TOKEN }}

          # Publish the results for public repositories to enable scorecard badges. For more details, see
          # https://github.com/ossf/scorecard-action#publishing-results.
          # For private repositories, `publish_results` will automatically be set to `false`, regardless
          # of the value entered here.
          publish_results: true
          # A publish rejection (e.g. a future enforcement change that
          # stops accepting reusable workflows) must fail the run, not
          # warn silently.
          fail_on_publish_error: true

      # Upload the results as artifacts (optional). Commenting out will disable uploads of run results in SARIF
      # format to the repository Actions tab.
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Upload the results to GitHub's code scanning dashboard.
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # tag=codeql-bundle-v4.39.0
        with:
          sarif_file: results.sarif
