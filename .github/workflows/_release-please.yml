---
name: Release Please

# Runs the reusable release-please workflow against this repository,
# advancing the floating major tag that callers pin (for example, @v5).

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - develop

permissions: {}

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-please.yml
    with:
      advance-floating-major: true
    secrets:
      release-please-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
