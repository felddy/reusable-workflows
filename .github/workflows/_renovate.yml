---
name: Renovate

# Updates the tool versions pinned inside the workflows (crane, trivy,
# buildkit, shfmt) that Dependabot's github-actions ecosystem cannot see.
# Each pin carries a `# renovate:` annotation naming its datasource; the
# repository-level config at .github/renovate.json enables only the custom
# regex managers so Renovate never overlaps with Dependabot.

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: 23 */6 * * * # four times a day, offset from the build cron
  workflow_dispatch:
    inputs:
      dry-run:
        default: false
        description: Log what would happen without creating branches or PRs
        required: false
        type: boolean
      log-level:
        default: info
        description: Renovate log level
        options:
          - debug
          - info
        required: false
        type: choice

concurrency:
  # Only one Renovate run at a time; a second scheduled run would race the
  # first on branch creation and rebasing.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    # A blocked or refused connection makes the token step retry for ~49
    # minutes; fail fast so the next scheduled run can recover.
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # tag=v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            ghcr.io:443
            github.com:443
            index.docker.io:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443

      - name: Generate a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # tag=v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Scope the installation token to what Renovate needs here;
          # workflows: write is required because the tracked version pins
          # live inside workflow files, and vulnerability-alerts: read lets
          # Renovate prioritize updates that fix Dependabot alerts.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Run Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # tag=v46.3.8
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          # Only operate on this repository; the repository-level config at
          # .github/renovate.json controls what gets updated.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The config is committed, so skip onboarding PRs.
          RENOVATE_ONBOARDING: "false"
          # Commit via the GitHub API as the App: this produces
          # GitHub-verified (signed) commits that satisfy the development
          # ruleset's required-signatures rule.
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_DRY_RUN: ${{ inputs.dry-run == true && 'full' || null }}
