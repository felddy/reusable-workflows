---
name: Container Build Workflow

# This reusable workflow builds OCI-compliant container images with modern
# supply chain security features.

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      # Required
      platforms:
        description: Platforms to build (JSON array string, e.g. '["linux/amd64","linux/arm64"]')
        required: true
        type: string

      # Image Configuration
      image-name:
        description: Container image name (without registry)
        required: false
        type: string
        default: ${{ github.repository }}

      # Build Configuration
      context:
        description: Build context path
        required: false
        type: string
        default: .

      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: ./Dockerfile

      build-args:
        description: Build arguments (multiline string, KEY=VALUE per line)
        required: false
        type: string
        default: ""

      target:
        description: Build target for multi-stage builds
        required: false
        type: string
        default: ""

      # Advanced Build
      bake-file:
        description: Path to buildx bake file (HCL/JSON)
        required: false
        type: string
        default: ""

      bake-targets:
        description: Bake targets to build (comma-separated)
        required: false
        type: string
        default: ""

      # Security Configuration
      scan-severity:
        description: Fail on vulnerabilities at or above this severity
        required: false
        type: string
        default: CRITICAL,HIGH

      # Caching
      cache-scope:
        description: Cache scope for this build
        required: false
        type: string
        default: ""

      # Debug
      debug:
        description: Enable debug mode (verbose logging)
        required: false
        type: boolean
        default: false

    secrets:
      signing-key:
        description: Cosign signing key
        required: false

      # Build secrets - pass individually for proper redaction
      # CRITICAL: Do NOT use JSON/XML/YAML blobs as secret values
      # GitHub cannot properly redact structured data
      # See: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
      build-secret-1:
        description: Build secret 1 (individual secret for proper redaction)
        required: false

      build-secret-2:
        description: Build secret 2 (individual secret for proper redaction)
        required: false

      build-secret-3:
        description: Build secret 3 (individual secret for proper redaction)
        required: false

      build-secret-4:
        description: Build secret 4 (individual secret for proper redaction)
        required: false

      build-secret-5:
        description: Build secret 5 (individual secret for proper redaction)
        required: false

      private-package-token:
        description: Token for private package authentication (use instead of GITHUB_TOKEN for private builds)
        required: false

    outputs:
      image-digest:
        description: Image digest (sha256:...)
        value: ${{ jobs.manifest.outputs.digest }}

      image-tags:
        description: Generated image tags
        value: ${{ jobs.metadata.outputs.image-tags }}

      image-version:
        description: Calculated version
        value: ${{ jobs.metadata.outputs.version }}

      full-image-name:
        description: Full image name with registry
        value: ghcr.io/${{ inputs.image-name }}

jobs:
  # Generate unique workflow call ID for artifact deconfliction
  generate-id:
    name: Generate Workflow Call ID
    runs-on: ubuntu-latest

    permissions:
      contents: none

    outputs:
      workflow-call-id: ${{ steps.generate.outputs.id }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # tag=v2.14.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            127.0.0.1

      - name: Generate unique ID
        id: generate
        run: |
          # Create a unique ID based on image name and run info
          # This ensures each workflow call has unique artifacts
          UNIQUE_ID=$(echo "${{ inputs.image-name }}-${{ github.run_id }}-${{ github.run_attempt }}" | sha256sum | cut -c1-8)
          echo "id=$UNIQUE_ID" >> $GITHUB_OUTPUT
          echo "Workflow call ID: $UNIQUE_ID (use this for all artifacts)"

  # Calculate SOURCE_DATE_EPOCH for reproducible builds
  calculate-source-date-epoch:
    name: Calculate SOURCE_DATE_EPOCH
    needs:
      - generate-id
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      source-date-epoch: ${{ steps.calculate.outputs.source-date-epoch }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # tag=v2.14.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # tag=v6.0.2

      - name: Calculate SOURCE_DATE_EPOCH
        id: calculate
        run: |
          # Calculate commit timestamp for SOURCE_DATE_EPOCH
          # This value is used conditionally in the build step:
          # - Release builds (refs/tags/*): Use commit timestamp for release tracking
          # - Development builds (branches, PRs): Use 0 for maximum cache reuse
          # The build step automatically selects the appropriate value based on github.ref
          if [ -d .git ]; then
            # Get the commit timestamp from git
            COMMIT_TIMESTAMP=$(git log -1 --format=%ct)
            echo "source-date-epoch=$COMMIT_TIMESTAMP" >> $GITHUB_OUTPUT
            COMMIT_DATE=$(date -u -d "@$COMMIT_TIMESTAMP" '+%Y-%m-%d %H:%M:%S UTC')
            echo "Reproducible build timestamp: $COMMIT_DATE (epoch: $COMMIT_TIMESTAMP)"
          else
            # Fallback to Unix epoch (0) for reproducibility
            FALLBACK_TIMESTAMP=0
            echo "source-date-epoch=$FALLBACK_TIMESTAMP" >> $GITHUB_OUTPUT
            echo "::warning::Not in a git repository, using Unix epoch (0) for SOURCE_DATE_EPOCH"
          fi

  # Determine visibility based on presence of private-package-token
  determine-visibility:
    name: Determine Visibility
    runs-on: ubuntu-latest
    needs:
      - generate-id

    permissions:
      contents: none

    outputs:
      link-repository: ${{ steps.check.outputs.link-repository }}
      is-private: ${{ steps.check.outputs.is-private }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # tag=v2.14.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            127.0.0.1

      - name: Check for private package token
        id: check
        run: |
          # If private-package-token is provided, package is private (unlinked)
          # Otherwise, package is public (linked to repository)
          if [[ -n "${{ secrets.private-package-token }}" ]]; then
            echo "link-repository=false" >> $GITHUB_OUTPUT
            echo "is-private=true" >> $GITHUB_OUTPUT
            echo "Private package mode: will NOT link to repository"
          else
            echo "link-repository=true" >> $GITHUB_OUTPUT
            echo "is-private=false" >> $GITHUB_OUTPUT
            echo "Public package mode: will link to repository"
          fi

  # Generate metadata (tags, labels, version)
  metadata:
    name: Generate Metadata
    needs:
      - generate-id
      - determine-visibility
    uses: ./.github/workflows/container-metadata.yml
    with:
      image-name: ${{ inputs.image-name }}
      link-repository: ${{ needs.determine-visibility.outputs.link-repository == 'true' }}

  # Build container image (multi-architecture support)
  build:
    name: Build ${{ matrix.platform }}
    needs:
      - generate-id
      - calculate-source-date-epoch
      - metadata
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Use platforms directly from input (already JSON array string)
        # This enables per-platform caching and parallel execution
        platform: ${{ fromJSON(inputs.platforms) }}

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

    env:
      PREDICATE_TYPE_PROVENANCE: https://slsa.dev/provenance/v1
      PREDICATE_TYPE_SBOM: https://spdx.dev/Document/v2.3
      PREDICATE_TYPE_VULN: https://cosign.sigstore.dev/attestation/vuln/v1
      PREDICATE_TYPE_BUILD_ENV: https://github.com/felddy/reusable-workflows/build-environment/v1
      # Tool versions
      COSIGN_VERSION: v2.6.2
      CRANE_VERSION: v0.21.0

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # tag=v2.14.2
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # tag=v6.0.2

      - name: Enable debug mode
        if: inputs.debug == true
        run: |
          echo "BUILDKIT_PROGRESS=plain" >> $GITHUB_ENV
          echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
          echo "Debug mode enabled - verbose logging active"

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # tag=v3.3.0
        with:
          platforms: ${{ inputs.platforms }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # tag=v3.12.0
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # tag=v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}

      - name: Parse build arguments
        id: parse-args
        run: |
          # Parse multiline build-args into format for docker build
          BUILD_ARGS="${{ inputs.build-args }}"

          if [[ -n "$BUILD_ARGS" ]]; then
            # Use a delimiter for multiline output
            delimiter="$(openssl rand -hex 8)"
            echo "args<<${delimiter}" >> $GITHUB_OUTPUT
            echo "$BUILD_ARGS" >> $GITHUB_OUTPUT
            echo "${delimiter}" >> $GITHUB_OUTPUT

            echo "Build arguments parsed successfully"
          else
            echo "args=" >> $GITHUB_OUTPUT
            echo "No build arguments provided"
          fi

      - name: Prepare build secrets
        id: secrets
        run: |
          # Prepare secrets for BuildKit secret mounts
          # Each secret is passed individually for proper GitHub redaction
          SECRETS=""

          if [[ -n "${{ secrets.build-secret-1 }}" ]]; then
            echo "${{ secrets.build-secret-1 }}" > /tmp/build-secret-1
            SECRETS="$SECRETS,id=build-secret-1,src=/tmp/build-secret-1"
          fi

          if [[ -n "${{ secrets.build-secret-2 }}" ]]; then
            echo "${{ secrets.build-secret-2 }}" > /tmp/build-secret-2
            SECRETS="$SECRETS,id=build-secret-2,src=/tmp/build-secret-2"
          fi

          if [[ -n "${{ secrets.build-secret-3 }}" ]]; then
            echo "${{ secrets.build-secret-3 }}" > /tmp/build-secret-3
            SECRETS="$SECRETS,id=build-secret-3,src=/tmp/build-secret-3"
          fi

          if [[ -n "${{ secrets.build-secret-4 }}" ]]; then
            echo "${{ secrets.build-secret-4 }}" > /tmp/build-secret-4
            SECRETS="$SECRETS,id=build-secret-4,src=/tmp/build-secret-4"
          fi

          if [[ -n "${{ secrets.build-secret-5 }}" ]]; then
            echo "${{ secrets.build-secret-5 }}" > /tmp/build-secret-5
            SECRETS="$SECRETS,id=build-secret-5,src=/tmp/build-secret-5"
          fi

          # Remove leading comma if present
          SECRETS="${SECRETS#,}"

          echo "secrets=$SECRETS" >> $GITHUB_OUTPUT

          if [[ -n "$SECRETS" ]]; then
            echo "Build secrets prepared (count: $(echo $SECRETS | tr ',' '\n' | wc -l))"
          fi

      - name: Prepare platform-specific cache scope
        id: cache-scope
        run: |
          # Create platform-specific cache scope for better cache hits
          PLATFORM="${{ matrix.platform }}"
          PLATFORM_SLUG="${PLATFORM//\//-}"  # Replace / with -

          BASE_SCOPE="${{ inputs.cache-scope || 'build' }}"
          PLATFORM_SCOPE="${BASE_SCOPE}-${PLATFORM_SLUG}"

          echo "scope=$PLATFORM_SCOPE" >> $GITHUB_OUTPUT
          echo "Cache scope: $PLATFORM_SCOPE"

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # tag=v6.10.0
        env:
          # Only upload build records in debug mode to reduce artifact storage
          DOCKER_BUILD_RECORD_UPLOAD: ${{ inputs.debug == true || env.ACTIONS_STEP_DEBUG == 'true' }}
          # SOURCE_DATE_EPOCH for reproducible builds (from calculate-source-date-epoch job)
          SOURCE_DATE_EPOCH: ${{ startsWith(github.ref, 'refs/tags/') && needs.calculate-source-date-epoch.outputs.source-date-epoch || '0' }}
        with:
          annotations: ${{ needs.metadata.outputs.annotations }}
          build-args: ${{ steps.parse-args.outputs.args }}
          cache-from: type=gha,scope=${{ steps.cache-scope.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.cache-scope.outputs.scope }}
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          labels: ${{ needs.metadata.outputs.image-labels }}
          outputs: type=image,name=ghcr.io/${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          secrets: ${{ steps.secrets.outputs.secrets }}
          target: ${{ inputs.target }}
        continue-on-error: true

      - name: Export digest
        id: digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "digest=$digest" >> $GITHUB_OUTPUT

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # tag=v3.7.0
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Authenticate cosign with registry
        run: |
          # Cosign needs explicit authentication to read attestations
          echo "${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}" | \
            cosign login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "✅ Cosign authenticated with registry"

      - name: Check attestation existence
        id: check-attestations
        timeout-minutes: 3
        run: |
          IMAGE_REF="ghcr.io/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}"

          echo "Checking for existing attestations on platform image..."
          echo "Image reference: $IMAGE_REF"

          # Function to check attestation existence
          check_attestation() {
            local predicate_type=$1
            local predicate_name=$2
            local max_attempts=3
            local attempt=1

            echo "Checking for $predicate_name attestation (predicate: $predicate_type)..."

            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt of $max_attempts..."

              # Separate stdout and stderr for better error handling
              if cosign download attestation \
                --predicate-type="$predicate_type" \
                "$IMAGE_REF" >/tmp/attestation-check.json 2>/tmp/attestation-error.json; then

                # Verify we actually got attestation data
                if [ -s /tmp/attestation-check.json ]; then
                  echo "✓ $predicate_name attestation exists, will skip"
                  return 0
                else
                  echo "⚠ Cosign succeeded but returned empty data (attempt $attempt)"
                fi
              else
                # Check error type
                if grep -q "UNAUTHORIZED\|FORBIDDEN\|401\|403" /tmp/attestation-error.json 2>/dev/null; then
                  echo "::warning::Authentication issue checking $predicate_name attestation"
                  cat /tmp/attestation-error.json
                  return 1  # Don't retry auth errors, recreate to be safe
                elif grep -q "no attestations found\|not found" /tmp/attestation-error.json 2>/dev/null; then
                  echo "✗ $predicate_name attestation not found, will create"
                  return 1
                else
                  echo "⚠ Transient error checking $predicate_name (attempt $attempt)"
                  cat /tmp/attestation-error.json
                fi
              fi

              # Retry with backoff if not last attempt
              if [ $attempt -lt $max_attempts ]; then
                echo "Retrying in 2 seconds..."
                sleep 2
              fi

              attempt=$((attempt + 1))
            done

            echo "✗ Failed to verify $predicate_name attestation after $max_attempts attempts, will recreate"
            return 1
          }

          # Check SBOM attestation
          if check_attestation "${{ env.PREDICATE_TYPE_SBOM }}" "SBOM"; then
            echo "sbom-exists=true" >> "$GITHUB_OUTPUT"
            echo "✓ SBOM attestation exists for ${{ matrix.platform }}, will skip SBOM generation"
          else
            echo "sbom-exists=false" >> "$GITHUB_OUTPUT"
            echo "✗ SBOM attestation missing for ${{ matrix.platform }}, will generate SBOM"
          fi

          # Check vulnerability scan attestation
          if check_attestation "${{ env.PREDICATE_TYPE_VULN }}" "vulnerability scan"; then
            echo "vuln-scan-exists=true" >> "$GITHUB_OUTPUT"
            echo "✓ Vulnerability scan attestation exists for ${{ matrix.platform }}, will skip scanning"
          else
            echo "vuln-scan-exists=false" >> "$GITHUB_OUTPUT"
            echo "✗ Vulnerability scan attestation missing for ${{ matrix.platform }}, will scan"
          fi

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # tag=v6.0.0
        with:
          if-no-files-found: error
          name: digests-${{ needs.generate-id.outputs.workflow-call-id }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

      # Scan platform image
      - name: Run Trivy vulnerability scanner (SARIF)
        id: trivy-sarif
        if: steps.check-attestations.outputs.vuln-scan-exists != 'true'
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # tag=0.34.0
        with:
          exit-code: 1
          format: sarif
          ignore-unfixed: true
          image-ref: ghcr.io/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          output: trivy-results-${{ strategy.job-index }}.sarif
          severity: ${{ inputs.scan-severity }}
          vuln-type: os,library
        continue-on-error: true

      - name: Run Trivy vulnerability scanner (JSON)
        id: trivy-json
        if: steps.check-attestations.outputs.vuln-scan-exists != 'true'
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # tag=0.34.0
        with:
          exit-code: 0
          format: json
          ignore-unfixed: true
          image-ref: ghcr.io/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          output: trivy-results-${{ strategy.job-index }}.json
          severity: ${{ inputs.scan-severity }}
          vuln-type: os,library

      - name: Parse scan results
        id: scan-result
        if: steps.check-attestations.outputs.vuln-scan-exists != 'true'
        run: |
          # Parse JSON results to count vulnerabilities by severity
          if [ -f trivy-results-${{ strategy.job-index }}.json ]; then
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results-${{ strategy.job-index }}.json || echo 0)
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results-${{ strategy.job-index }}.json || echo 0)
            MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-results-${{ strategy.job-index }}.json || echo 0)
            LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-results-${{ strategy.job-index }}.json || echo 0)

            echo "Platform ${{ matrix.platform }} vulnerabilities: CRITICAL=$CRITICAL, HIGH=$HIGH, MEDIUM=$MEDIUM, LOW=$LOW"
          fi

          # Set scan passed status
          if [ "${{ steps.trivy-sarif.outcome }}" = "success" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "✅ Scan passed for ${{ matrix.platform }}"
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "❌ Scan failed for ${{ matrix.platform }}"
          fi

      - name: Upload scan results
        if: steps.check-attestations.outputs.vuln-scan-exists != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # tag=v6.0.0
        with:
          name: security-scan-results-${{ needs.generate-id.outputs.workflow-call-id }}-${{ strategy.job-index }}
          path: |
            trivy-results-${{ strategy.job-index }}.sarif
            trivy-results-${{ strategy.job-index }}.json
          retention-days: 30

      - name: Upload SARIF to GitHub Security
        if: steps.check-attestations.outputs.vuln-scan-exists != 'true'
        uses: github/codeql-action/upload-sarif@9e907b5e64f6b83e7804b09294d44122997950d6 # tag=codeql-bundle-v4.32.3
        with:
          category: container-scan-${{ matrix.platform }}
          sarif_file: trivy-results-${{ strategy.job-index }}.sarif

      - name: Fail if vulnerabilities found
        if: steps.check-attestations.outputs.vuln-scan-exists != 'true' && steps.trivy-sarif.outcome == 'failure'
        run: |
          echo "::error::Security scan failed for ${{ matrix.platform }} - vulnerabilities found above threshold: ${{ inputs.scan-severity }}"
          exit 1

      - name: Attest vulnerability scan results
        id: attest-vuln-scan
        if: steps.check-attestations.outputs.vuln-scan-exists != 'true'
        uses: actions/attest@e59cbc1ad1ac2d59339667419eb8cdde6eb61e3d # tag=v3.2.0
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: ${{ env.PREDICATE_TYPE_VULN }}
          predicate-path: trivy-results-${{ strategy.job-index }}.json
          push-to-registry: true
        continue-on-error: true

      # Generate attestations for platform
      - name: Install Syft
        if: steps.check-attestations.outputs.sbom-exists != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft version

      - name: Generate SBOM
        id: generate-sbom
        if: steps.check-attestations.outputs.sbom-exists != 'true'
        run: |
          PLATFORM_SLUG=$(echo "${{ matrix.platform }}" | tr '/' '-')
          syft "ghcr.io/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}" \
            -o spdx-json > "sbom-${PLATFORM_SLUG}.spdx.json"
          echo "sbom-file=sbom-${PLATFORM_SLUG}.spdx.json" >> $GITHUB_OUTPUT
          echo "✅ Generated SBOM for ${{ matrix.platform }}"

      - name: Attest SBOM
        if: steps.check-attestations.outputs.sbom-exists != 'true'
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # tag=v3.0.0
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ steps.generate-sbom.outputs.sbom-file }}
          push-to-registry: true

      - name: Upload SBOM artifact
        if: steps.generate-sbom.outputs.sbom-file != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # tag=v6.0.0
        with:
          name: sbom-${{ needs.generate-id.outputs.workflow-call-id }}-${{ strategy.job-index }}
          path: ${{ steps.generate-sbom.outputs.sbom-file }}
          retention-days: 90

      - name: Clean up secret files
        if: always()
        run: |
          rm -f /tmp/build-secret-*

      - name: Output platform build summary
        if: always()
        run: |
          echo "## Platform Build Complete: ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Cache Scope:** \`${{ steps.cache-scope.outputs.scope }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check-attestations.outputs.sbom-exists }}" = "true" ] || [ "${{ steps.check-attestations.outputs.vuln-scan-exists }}" = "true" ]; then
            echo "### ⏭️  Attestations Already Exist" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Skipped work for existing attestations:" >> $GITHUB_STEP_SUMMARY

            if [ "${{ steps.check-attestations.outputs.vuln-scan-exists }}" = "true" ]; then
              echo "- ✓ Vulnerability scanning (attestation exists)" >> $GITHUB_STEP_SUMMARY
            fi

            if [ "${{ steps.check-attestations.outputs.sbom-exists }}" = "true" ]; then
              echo "- ✓ SBOM generation (attestation exists)" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Reproducibility Information" >> $GITHUB_STEP_SUMMARY
          echo "**SOURCE_DATE_EPOCH:** \`${{ needs.calculate-source-date-epoch.outputs.source-date-epoch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This build uses deterministic timestamps for reproducibility." >> $GITHUB_STEP_SUMMARY
          echo "Rebuilding the same commit with the same inputs should produce the same digest." >> $GITHUB_STEP_SUMMARY

  # Create multi-platform manifest
  manifest:
    name: Create Multi-Platform Manifest
    needs:
      - generate-id
      - metadata
      - build
      - determine-visibility
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.manifest.outputs.digest }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # tag=v2.14.2
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Download all digests
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # tag=v4.1.8
        with:
          merge-multiple: true
          path: /tmp/digests
          pattern: digests-${{ needs.generate-id.outputs.workflow-call-id }}-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # tag=v3.12.0

      - name: Log in to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # tag=v3.7.0
        with:
          password: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Install crane
        run: |
          # Install crane for manifest digest extraction
          VERSION="v0.20.2"
          curl -sL "https://github.com/google/go-containerregistry/releases/download/${VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin crane
          crane version

      - name: Create manifest list and push
        id: manifest
        working-directory: /tmp/digests
        run: |
          # Collect all platform digests
          DIGESTS=""
          DIGEST_COUNT=0
          for digest_file in *; do
            if [[ -f "$digest_file" ]]; then
              DIGESTS="$DIGESTS ghcr.io/${{ inputs.image-name }}@sha256:${digest_file}"
              DIGEST_COUNT=$((DIGEST_COUNT + 1))
            fi
          done

          if [[ $DIGEST_COUNT -eq 0 ]]; then
            echo "::error::No platform digests found"
            echo "::error::This usually means all platform builds failed"
            exit 1
          fi

          echo "Found $DIGEST_COUNT platform digest(s)"

          # Create manifest for each tag
          TAGS="${{ needs.metadata.outputs.image-tags }}"

          # Convert newline-separated tags to array
          IFS=$'\n' read -rd '' -a TAG_ARRAY <<< "$TAGS" || true

          MANIFEST_DIGEST=""
          TAG_COUNT=0
          for tag in "${TAG_ARRAY[@]}"; do
            if [[ -n "$tag" ]]; then
              TAG_COUNT=$((TAG_COUNT + 1))
              echo "::group::Creating manifest for $tag"

              if docker buildx imagetools create \
                --tag "$tag" \
                $DIGESTS; then
                echo "✓ Manifest created for $tag"
              else
                echo "::error::Failed to create manifest for $tag"
                echo "::endgroup::"
                exit 1
              fi

              echo "::endgroup::"

              # Get the digest of the manifest (same for all tags)
              if [[ -z "$MANIFEST_DIGEST" ]]; then
                MANIFEST_DIGEST=$(crane digest "$tag")
                echo "Manifest digest: $MANIFEST_DIGEST"
              fi
            fi
          done

          if [[ -z "$MANIFEST_DIGEST" ]]; then
            echo "::error::Failed to get manifest digest"
            exit 1
          fi

          # Validate digest format (should be sha256:...)
          if [[ ! "$MANIFEST_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid manifest digest format: $MANIFEST_DIGEST"
            echo "::error::Expected format: sha256:<64 hex characters>"
            exit 1
          fi

          echo "digest=$MANIFEST_DIGEST" >> $GITHUB_OUTPUT
          echo "✅ Multi-platform manifest created: $MANIFEST_DIGEST"
          echo "Created $TAG_COUNT tag(s) for $DIGEST_COUNT platform(s)"

      - name: Inspect manifest
        run: |
          FIRST_TAG=$(echo "${{ needs.metadata.outputs.image-tags }}" | head -n1)
          echo "::group::Manifest Details"
          docker buildx imagetools inspect "$FIRST_TAG" || true
          echo "::endgroup::"

      - name: Validate reproducibility best practices
        run: |
          echo "::group::Reproducibility Validation"

          # Check if Dockerfile uses pinned base images
          if [ -f "${{ inputs.dockerfile }}" ]; then
            echo "Checking Dockerfile for reproducibility best practices..."

            # Look for FROM statements without digests
            UNPINNED=$(grep -E '^FROM\s+[^@]+$' "${{ inputs.dockerfile }}" || true)

            if [ -n "$UNPINNED" ]; then
              echo "::warning::Base images without pinned digests detected in ${{ inputs.dockerfile }}"
              echo "::warning::For reproducible builds, pin base images to digests:"
              echo "$UNPINNED" | while read -r line; do
                echo "::warning::  $line"
              done
            else
              echo "✅ All base images appear to use digests (good for reproducibility)"
            fi
          fi

          echo "::endgroup::"

      - name: Output manifest summary
        run: |
          echo "## Multi-Platform Manifest Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ inputs.image-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Manifest Digest:** \`${{ steps.manifest.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** \`${{ inputs.platforms }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add reproducibility note
          echo "### 🔄 Reproducibility" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This build uses SOURCE_DATE_EPOCH for deterministic timestamps." >> $GITHUB_STEP_SUMMARY
          echo "For fully reproducible builds, ensure:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Base images are pinned to digests (not just tags)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All dependencies use exact versions" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build process is deterministic" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.determine-visibility.outputs.link-repository }}" == "false" ]]; then
            echo "### 🔒 Private Package" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This image is private because it is NOT linked to the repository." >> $GITHUB_STEP_SUMMARY
            echo "The \`org.opencontainers.image.source\` label was omitted, so the package:" >> $GITHUB_STEP_SUMMARY
            echo "- Is scoped to the user/org account (not the repository)" >> $GITHUB_STEP_SUMMARY
            echo "- Is private by default" >> $GITHUB_STEP_SUMMARY
            echo "- Will NOT appear on the repository packages page" >> $GITHUB_STEP_SUMMARY
            echo "- Access is controlled via package permissions" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**To pull this private image:**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "echo \$PAT | docker login ghcr.io -u USERNAME --password-stdin" >> $GITHUB_STEP_SUMMARY
            FIRST_TAG=$(echo "${{ needs.metadata.outputs.image-tags }}" | head -n1)
            echo "docker pull $FIRST_TAG" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          FIRST_TAG=$(echo "${{ needs.metadata.outputs.image-tags }}" | head -n1)
          echo "docker pull $FIRST_TAG" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verify Multi-Arch" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker buildx imagetools inspect $FIRST_TAG" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Generate attestations for multi-platform manifest
  attest-manifest:
    name: Attest Manifest
    needs:
      - generate-id
      - metadata
      - manifest
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      PREDICATE_TYPE_PROVENANCE: https://slsa.dev/provenance/v1
      PREDICATE_TYPE_BUILD_ENV: https://github.com/felddy/reusable-workflows/build-environment/v1

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # tag=v2.14.2
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # tag=v6.0.2

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # tag=v3.7.0
        with:
          cosign-release: v2.6.2

      - name: Set SOURCE_DATE_EPOCH for reproducible builds
        id: source-date-epoch
        run: |
          if [ -d .git ]; then
            COMMIT_TIMESTAMP=$(git log -1 --format=%ct)
            echo "SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP" >> $GITHUB_ENV
            echo "source-date-epoch=$COMMIT_TIMESTAMP" >> $GITHUB_OUTPUT
            COMMIT_DATE=$(date -u -d "@$COMMIT_TIMESTAMP" '+%Y-%m-%d %H:%M:%S UTC')
            echo "Reproducible build timestamp: $COMMIT_DATE (epoch: $COMMIT_TIMESTAMP)"
          else
            FALLBACK_TIMESTAMP=0
            echo "SOURCE_DATE_EPOCH=$FALLBACK_TIMESTAMP" >> $GITHUB_ENV
            echo "source-date-epoch=$FALLBACK_TIMESTAMP" >> $GITHUB_OUTPUT
            echo "::warning::Not in a git repository, using Unix epoch (0) for SOURCE_DATE_EPOCH"
          fi

      - name: Log in to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # tag=v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}

      - name: Authenticate cosign with registry
        run: |
          # Cosign needs explicit authentication to read attestations
          echo "${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}" | \
            cosign login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "✅ Cosign authenticated with registry"

      - name: Check attestation existence
        id: check-attestations
        timeout-minutes: 3
        run: |
          IMAGE_REF="ghcr.io/${{ inputs.image-name }}@${{ needs.manifest.outputs.digest }}"

          echo "Checking for existing attestations on manifest..."
          echo "Image reference: $IMAGE_REF"

          # Function to check attestation existence
          check_attestation() {
            local predicate_type=$1
            local predicate_name=$2
            local max_attempts=3
            local attempt=1

            echo "Checking for $predicate_name attestation (predicate: $predicate_type)..."

            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt of $max_attempts..."

              # Separate stdout and stderr for better error handling
              if cosign download attestation \
                --predicate-type="$predicate_type" \
                "$IMAGE_REF" >/tmp/attestation-check.json 2>/tmp/attestation-error.json; then

                # Verify we actually got attestation data
                if [ -s /tmp/attestation-check.json ]; then
                  echo "✓ $predicate_name attestation exists, will skip"
                  return 0
                else
                  echo "⚠ Cosign succeeded but returned empty data (attempt $attempt)"
                fi
              else
                # Check error type
                if grep -q "UNAUTHORIZED\|FORBIDDEN\|401\|403" /tmp/attestation-error.json 2>/dev/null; then
                  echo "::warning::Authentication issue checking $predicate_name attestation"
                  cat /tmp/attestation-error.json
                  return 1  # Don't retry auth errors, recreate to be safe
                elif grep -q "no attestations found\|not found" /tmp/attestation-error.json 2>/dev/null; then
                  echo "✗ $predicate_name attestation not found, will create"
                  return 1
                else
                  echo "⚠ Transient error checking $predicate_name (attempt $attempt)"
                  cat /tmp/attestation-error.json
                fi
              fi

              # Retry with backoff if not last attempt
              if [ $attempt -lt $max_attempts ]; then
                echo "Retrying in 2 seconds..."
                sleep 2
              fi

              attempt=$((attempt + 1))
            done

            echo "✗ Failed to verify $predicate_name attestation after $max_attempts attempts, will recreate"
            return 1
          }

          # Check provenance attestation
          if check_attestation "${{ env.PREDICATE_TYPE_PROVENANCE }}" "provenance"; then
            echo "provenance-exists=true" >> "$GITHUB_OUTPUT"
            echo "✓ Provenance attestation exists (predicateType ${{ env.PREDICATE_TYPE_PROVENANCE }}), will skip"
          else
            echo "provenance-exists=false" >> "$GITHUB_OUTPUT"
            echo "✗ Provenance attestation missing (predicateType ${{ env.PREDICATE_TYPE_PROVENANCE }}), will create"
          fi

          # Check build environment attestation
          if check_attestation "${{ env.PREDICATE_TYPE_BUILD_ENV }}" "build environment"; then
            echo "build-env-exists=true" >> "$GITHUB_OUTPUT"
            echo "✓ Build environment attestation exists (predicateType ${{ env.PREDICATE_TYPE_BUILD_ENV }}), will skip"
          else
            echo "build-env-exists=false" >> "$GITHUB_OUTPUT"
            echo "✗ Build environment attestation missing (predicateType ${{ env.PREDICATE_TYPE_BUILD_ENV }}), will create"
          fi

      - name: Generate SLSA provenance
        id: provenance
        if: steps.check-attestations.outputs.provenance-exists != 'true'
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # tag=v1.4.3
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ needs.manifest.outputs.digest }}
          push-to-registry: true

      - name: Capture build environment metadata
        id: build-env
        run: |
          cat > build-environment.json <<EOF
          {
            "buildEnvironment": {
              "sourceRepository": "${{ github.repository }}",
              "sourceCommit": "${{ github.sha }}",
              "sourceRef": "${{ github.ref }}",
              "sourceDateEpoch": "${SOURCE_DATE_EPOCH:-}",
              "buildTimestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "builder": {
                "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "platform": "GitHub Actions",
                "runnerOS": "${{ runner.os }}",
                "runnerArch": "${{ runner.arch }}"
              },
              "tools": {
                "docker": "$(docker --version | cut -d' ' -f3 | tr -d ',')",
                "buildx": "$(docker buildx version | cut -d' ' -f2)",
                "git": "$(git --version | cut -d' ' -f3)"
              }
            }
          }
          EOF
          echo "Build environment metadata captured"

      - name: Attach build environment as custom attestation
        id: attest-build-env
        if: steps.check-attestations.outputs.build-env-exists != 'true'
        uses: actions/attest@e59cbc1ad1ac2d59339667419eb8cdde6eb61e3d # tag=v3.2.0
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ needs.manifest.outputs.digest }}
          predicate-type: ${{ env.PREDICATE_TYPE_BUILD_ENV }}
          predicate-path: build-environment.json
          push-to-registry: true
        continue-on-error: true

      - name: Upload attestation artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # tag=v6.0.0
        with:
          name: attestations-${{ needs.generate-id.outputs.workflow-call-id }}
          path: |
            build-environment.json
            ${{ steps.provenance.outputs.bundle-path }}
          retention-days: 90
          if-no-files-found: ignore

      - name: Generate attestation summary
        if: always()
        run: |
          echo "## Attestation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ inputs.image-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Manifest Digest:** \`${{ needs.manifest.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Attestations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.provenance.outcome }}" = "success" ]; then
            echo "✅ SLSA Provenance (manifest)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️  SLSA Provenance (skipped - already exists)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "✅ SBOM (per-platform, generated during build)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Vulnerability Scan (per-platform, generated during build)" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.attest-build-env.outcome }}" = "success" ]; then
            echo "✅ Build Environment (manifest)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️  Build Environment (skipped)" >> $GITHUB_STEP_SUMMARY
          fi

  # Sign container image (always enabled)
  sign:
    name: Sign Container Image
    needs:
      - metadata
      - manifest
      - attest-manifest
    if: |
      always() &&
      needs.attest-manifest.result == 'success' &&
      needs.manifest.result == 'success'
    uses: ./.github/workflows/container-sign.yml
    with:
      image-ref: ghcr.io/${{ inputs.image-name }}@${{ needs.manifest.outputs.digest }}
      image-name: ${{ inputs.image-name }}
      registry: ghcr.io
      use-keyless: true
    secrets:
      signing-key: ${{ secrets.signing-key }}
      private-package-token: ${{ secrets.private-package-token }}
