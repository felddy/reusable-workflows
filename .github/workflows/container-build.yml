---
name: Container Build Workflow

# This reusable workflow builds OCI-compliant container images with modern
# supply chain security features.

# Permissions are set at the job level; default to none at workflow level.
permissions: {}

# Tool Versions - Update these to bump tool versions across the workflow
env:
  CRANE_VERSION: v0.21.1

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      # Required
      build-matrix:
        description: >
          Platform/runner matrix (JSON object string with an include list,
          e.g. '{"include":[{"platform":"linux/amd64","runner":"ubuntu-latest"}]}').
          Produced by container-pipeline.yml's generate-matrix job.
        required: true
        type: string

      # Metadata (produced once by container-pipeline.yml's metadata job)
      image-labels:
        description: OCI labels to apply (newline-separated key=value)
        required: false
        type: string
        default: ""

      image-annotations:
        description: OCI annotations to apply (newline-separated)
        required: false
        type: string
        default: ""

      source-date-epoch:
        description: >
          Unix epoch used as SOURCE_DATE_EPOCH on release-tag builds for
          reproducible timestamps. Development builds always use 0 for
          maximum layer-cache reuse.
        required: false
        type: string
        default: ""

      # Publishing
      push:
        description: Push image to registry (set to false for PR builds to avoid
          publishing untrusted images)
        required: false
        type: boolean
        default: true

      # Image Configuration
      image-name:
        description: Container image name (without registry)
        required: false
        type: string
        default: ${{ github.repository }}

      # Build Configuration
      context:
        description: Build context path
        required: false
        type: string
        default: .

      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: ./Dockerfile

      build-args:
        description: Build arguments (multiline string, KEY=VALUE per line)
        required: false
        type: string
        default: ""

      target:
        description: Build target for multi-stage builds
        required: false
        type: string
        default: ""

      # Security Configuration
      scan-severity:
        description: >
          Fail on vulnerabilities at or above this severity (e.g.
          CRITICAL,HIGH). Set to empty string to disable the vulnerability gate
          entirely.
        required: false
        type: string
        default: CRITICAL,HIGH

      upload-scan-results:
        description: >
          Upload vulnerability scan results (SARIF) to GitHub Security tab. Set
          to false when vulnerabilities are in third-party code unrelated to
          this repository (e.g. pre-installed application binaries).
        required: false
        type: boolean
        default: true

      vex-file:
        description: >
          Path to an OpenVEX document in the caller repository; passed to
          Trivy so known-not-exploitable findings are suppressed instead of
          failing the severity gate.
        required: false
        type: string
        default: ""

      # Caching
      cache-scope:
        description: Cache scope for this build
        required: false
        type: string
        default: ""

      # Debug
      debug:
        description: Enable debug mode (verbose logging)
        required: false
        type: boolean
        default: false

      # Build secret IDs — controls the --secret id= name used in Dockerfile RUN mounts.
      # Defaults to build-secret-N if not specified.
      build-secret-1-name:
        description: Secret ID for build-secret-1 (used as --secret id=NAME in Dockerfile)
        required: false
        type: string
        default: build-secret-1

      build-secret-2-name:
        description: Secret ID for build-secret-2 (used as --secret id=NAME in Dockerfile)
        required: false
        type: string
        default: build-secret-2

      build-secret-3-name:
        description: Secret ID for build-secret-3 (used as --secret id=NAME in Dockerfile)
        required: false
        type: string
        default: build-secret-3

      build-secret-4-name:
        description: Secret ID for build-secret-4 (used as --secret id=NAME in Dockerfile)
        required: false
        type: string
        default: build-secret-4

      build-secret-5-name:
        description: Secret ID for build-secret-5 (used as --secret id=NAME in Dockerfile)
        required: false
        type: string
        default: build-secret-5

    secrets:
      # Build secrets - pass individually for proper redaction
      # CRITICAL: Do NOT use JSON/XML/YAML blobs as secret values
      # GitHub cannot properly redact structured data
      # See: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
      build-secret-1:
        description: Build secret 1 (individual secret for proper redaction)
        required: false

      build-secret-2:
        description: Build secret 2 (individual secret for proper redaction)
        required: false

      build-secret-3:
        description: Build secret 3 (individual secret for proper redaction)
        required: false

      build-secret-4:
        description: Build secret 4 (individual secret for proper redaction)
        required: false

      build-secret-5:
        description: Build secret 5 (individual secret for proper redaction)
        required: false

      private-package-token:
        description: >
          Token for private package authentication (use instead of GITHUB_TOKEN
          for private builds). Required permissions: packages:write,
          packages:read. Generate a fine-grained personal access token at
          https://github.com/settings/personal-access-tokens/new with "Read and
          Write access to packages" under Repository permissions.
        required: false

      private-package-username:
        description: >
          Username for private-package-token authentication. Required when the
          PAT owner differs from github.repository_owner (e.g. org repos using a
          service account PAT). Defaults to github.repository_owner when absent.
        required: false

      docker-hub-username:
        description: >
          Docker Hub username for authenticated base-image pulls. When
          mirror.gcr.io misses and the pull falls back to Docker Hub, these
          credentials replace the anonymous per-IP quota shared by all
          GitHub-hosted runners.
        required: false

      docker-hub-password:
        description: >
          Docker Hub access token (or password) paired with
          docker-hub-username.
        required: false

    outputs:
      image-name:
        description: The image name used in this build
        value: ${{ inputs.image-name }}

jobs:
  # Build container image (multi-architecture support)
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.build-matrix) }}

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      # actions/attest@v4 records artifact storage metadata
      artifact-metadata: write
      security-events: write

    env:
      PREDICATE_TYPE_PROVENANCE: https://slsa.dev/provenance/v1
      PREDICATE_TYPE_SBOM: https://spdx.dev/Document/v2.3
      PREDICATE_TYPE_VULN: https://cosign.sigstore.dev/attestation/vuln/v1
      PREDICATE_TYPE_BUILD_ENV: https://github.com/felddy/reusable-workflows/build-environment/v1
      # Ordered fallback lists so a single registry outage cannot fail the
      # vulnerability scans (Trivy tries each repository in turn).
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1
      # The secrets context is unavailable in step-level `if`, so surface
      # the presence check through the job environment instead.
      DOCKER_HUB_CONFIGURED: ${{ secrets.docker-hub-username != '' &&
        secrets.docker-hub-password != '' }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # tag=v2.22.1
        with:
          # sudo is required to configure the Docker daemon registry mirror.
          # This job already controls the Docker daemon (root-equivalent),
          # so disabling sudo would not reduce its privileges.
          disable-sudo: false
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      - name: Enable debug mode
        if: inputs.debug == true
        run: |
          echo "BUILDKIT_PROGRESS=plain" >> $GITHUB_ENV
          echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
          echo "Debug mode enabled - verbose logging active"

      - name: Configure Docker registry mirror
        # Route docker.io pulls through mirror.gcr.io: mirror pulls do not
        # count against Docker Hub rate limits, and a cache miss falls back
        # to Docker Hub automatically. This is an inline step rather than a
        # local composite action because local action paths resolve against
        # the caller's checkout when this reusable workflow runs in another
        # repository. Keep in sync with the copy in container-test.yml.
        run: |
          if [[ -s /etc/docker/daemon.json ]]; then
            jq '."registry-mirrors" = ["https://mirror.gcr.io"]' /etc/docker/daemon.json > /tmp/daemon.json
          else
            jq -n '{"registry-mirrors": ["https://mirror.gcr.io"]}' > /tmp/daemon.json
          fi
          sudo mkdir -p /etc/docker
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
          echo "Docker daemon registry mirrors:"
          docker info --format '{{json .RegistryConfig.Mirrors}}'

      - name: Log in to Docker Hub for fallback pulls
        # Authenticates the Docker Hub fallback path used when mirror.gcr.io
        # misses. Must precede QEMU/Buildx setup: those steps pull binfmt and
        # moby/buildkit through the daemon and would otherwise fall back
        # anonymously. Pull-only; images are pushed to ghcr.io.
        if: env.DOCKER_HUB_CONFIGURED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # tag=v4.6.0
        with:
          username: ${{ secrets.docker-hub-username }}
          password: ${{ secrets.docker-hub-password }}

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # tag=v3.3.0
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # tag=v4.4.0
        with:
          # Mirror docker.io inside BuildKit as well, so Dockerfile FROM
          # images avoid Docker Hub rate limits with the same fallback.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          driver-opts: |
            image=moby/buildkit:v0.28.1
            network=host

      - name: Log in to container registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # tag=v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.private-package-token && (secrets.private-package-username
            || github.repository_owner) || github.actor }}
          password: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}

      - name: Parse build arguments
        id: parse-args
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          # Parse multiline build-args into format for docker build
          if [[ -n "$BUILD_ARGS" ]]; then
            # Use a delimiter for multiline output
            delimiter="$(openssl rand -hex 8)"
            echo "args<<${delimiter}" >> $GITHUB_OUTPUT
            echo "$BUILD_ARGS" >> $GITHUB_OUTPUT
            echo "${delimiter}" >> $GITHUB_OUTPUT

            echo "Build arguments parsed successfully"
          else
            echo "args=" >> $GITHUB_OUTPUT
            echo "No build arguments provided"
          fi

      - name: Prepare build secrets
        id: secrets
        env:
          BUILD_SECRET_1: ${{ secrets.build-secret-1 }}
          BUILD_SECRET_2: ${{ secrets.build-secret-2 }}
          BUILD_SECRET_3: ${{ secrets.build-secret-3 }}
          BUILD_SECRET_4: ${{ secrets.build-secret-4 }}
          BUILD_SECRET_5: ${{ secrets.build-secret-5 }}
          BUILD_SECRET_1_NAME: ${{ inputs.build-secret-1-name }}
          BUILD_SECRET_2_NAME: ${{ inputs.build-secret-2-name }}
          BUILD_SECRET_3_NAME: ${{ inputs.build-secret-3-name }}
          BUILD_SECRET_4_NAME: ${{ inputs.build-secret-4-name }}
          BUILD_SECRET_5_NAME: ${{ inputs.build-secret-5-name }}
        run: |
          # Prepare secrets for BuildKit secret mounts.
          # secret-files input expects newline-separated "id=path" entries.
          # We write each secret to a temp file and output the id=path pairs.
          # Using secret-files (file paths) rather than secrets (inline values)
          # avoids the newline stripping GitHub Actions applies to multiline
          # step-output expressions inside with: blocks.
          umask 077
          SECRET_FILES=""
          SECRET_COUNT=0

          for i in 1 2 3 4 5; do
            value_var="BUILD_SECRET_${i}"
            name_var="BUILD_SECRET_${i}_NAME"
            if [[ -n "${!value_var}" ]]; then
              printf '%s' "${!value_var}" > "/tmp/build-secret-${i}"
              SECRET_FILES="${SECRET_FILES}${!name_var}=/tmp/build-secret-${i}"$'\n'
              SECRET_COUNT=$((SECRET_COUNT + 1))
            fi
          done

          # Write multiline output using heredoc delimiter
          delimiter="$(openssl rand -hex 8)"
          echo "secret-files<<${delimiter}" >> $GITHUB_OUTPUT
          printf '%s' "${SECRET_FILES}" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT

          if [[ $SECRET_COUNT -gt 0 ]]; then
            echo "Build secrets prepared (count: $SECRET_COUNT)"
          fi

      - name: Prepare platform-specific cache scope
        id: cache-scope
        env:
          PLATFORM: ${{ matrix.platform }}
          BASE_SCOPE: ${{ inputs.cache-scope || 'build' }}
        run: |
          # Create platform-specific cache scope for better cache hits.
          # Slug the whole scope: the base may be an image name with slashes.
          PLATFORM_SCOPE=$(echo "${BASE_SCOPE}-${PLATFORM}" | tr '/' '-')

          echo "scope=$PLATFORM_SCOPE" >> $GITHUB_OUTPUT
          echo "Cache scope: $PLATFORM_SCOPE"

      - name: Build and push container image (attempt 1)
        id: build-1
        # A transient registry failure (rate limit, mirror outage) fails this
        # attempt without failing the job; attempt 2 retries once from the
        # warm layer cache. Keep env/with in sync with attempt 2.
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # tag=v7.4.0
        env:
          # Only upload build records in debug mode to reduce artifact storage
          DOCKER_BUILD_RECORD_UPLOAD: ${{ inputs.debug == true || env.ACTIONS_STEP_DEBUG == 'true' }}
          # SOURCE_DATE_EPOCH controls layer timestamps for reproducible builds.
          # On release tags: use the commit timestamp so published images have
          # meaningful, stable timestamps that match the release commit.
          # On branches/PRs: intentionally use 0 (Unix epoch) so BuildKit can
          # reuse cached layers regardless of when the commit was made. Using the
          # real timestamp on dev builds would bust the cache on every commit.
          SOURCE_DATE_EPOCH: ${{ startsWith(github.ref, 'refs/tags/') &&
            inputs.source-date-epoch != '' &&
            inputs.source-date-epoch || '0'
            }}
        with:
          annotations: ${{ inputs.image-annotations }}
          build-args: ${{ steps.parse-args.outputs.args }}
          cache-from: type=gha,scope=${{ steps.cache-scope.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.cache-scope.outputs.scope }}
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          labels: ${{ inputs.image-labels }}
          outputs: type=image,name=ghcr.io/${{ inputs.image-name
            }},push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          secret-files: ${{ steps.secrets.outputs.secret-files }}
          target: ${{ inputs.target }}

      - name: Build and push container image (attempt 2)
        id: build-2
        if: steps.build-1.outcome == 'failure'
        # Keep env/with in sync with attempt 1.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # tag=v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: ${{ inputs.debug == true || env.ACTIONS_STEP_DEBUG == 'true' }}
          SOURCE_DATE_EPOCH: ${{ startsWith(github.ref, 'refs/tags/') &&
            inputs.source-date-epoch != '' &&
            inputs.source-date-epoch || '0'
            }}
        with:
          annotations: ${{ inputs.image-annotations }}
          build-args: ${{ steps.parse-args.outputs.args }}
          cache-from: type=gha,scope=${{ steps.cache-scope.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.cache-scope.outputs.scope }}
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          labels: ${{ inputs.image-labels }}
          outputs: type=image,name=ghcr.io/${{ inputs.image-name
            }},push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          secret-files: ${{ steps.secrets.outputs.secret-files }}
          target: ${{ inputs.target }}

      - name: Resolve build result
        id: build
        env:
          OUTCOME_1: ${{ steps.build-1.outcome }}
          OUTCOME_2: ${{ steps.build-2.outcome }}
          DIGEST_1: ${{ steps.build-1.outputs.digest }}
          DIGEST_2: ${{ steps.build-2.outputs.digest }}
        run: |
          # Normalize the two attempts into a single step output so the rest
          # of the job (and the job's outputs) reference one digest source.
          if [[ "${OUTCOME_1}" == "success" ]]; then
            echo "digest=${DIGEST_1}" >> "$GITHUB_OUTPUT"
          elif [[ "${OUTCOME_2}" == "success" ]]; then
            echo "::warning::First build attempt failed; retry succeeded"
            echo "digest=${DIGEST_2}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Both build attempts failed"
            exit 1
          fi

      - name: Export digest
        id: digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ inputs.image-name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # Validate digest is non-empty and well-formed before proceeding
          if [[ -z "$DIGEST" ]]; then
            echo "::error::Build step produced no digest - build likely failed"
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid digest format: $DIGEST"
            exit 1
          fi

          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Digest: $DIGEST"

          # Derive slugs for artifact naming
          IMAGE_SLUG=$(echo "$IMAGE_NAME" | tr '/' '-')
          PLATFORM_SLUG=$(echo "$PLATFORM" | tr '/' '-')
          echo "image-slug=${IMAGE_SLUG}" >> $GITHUB_OUTPUT
          echo "platform-slug=${PLATFORM_SLUG}" >> $GITHUB_OUTPUT
          echo "Artifact name: digests-${IMAGE_SLUG}-${PLATFORM_SLUG}"

      - name: Install cosign
        if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # tag=v4.1.2

      - name: Authenticate cosign with registry
        if: inputs.push
        env:
          # Prefer an explicit username for private-package-token if provided, otherwise
          # fall back to repository_owner (when using the PAT) or github.actor.
          REGISTRY_USER: ${{ secrets.private-package-token && (secrets.private-package-username
            || github.repository_owner) || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}
        run: |
          # Cosign needs explicit authentication to read attestations
          echo "$REGISTRY_TOKEN" | \
            cosign login ghcr.io -u "$REGISTRY_USER" --password-stdin
          echo "✅ Cosign authenticated with registry"

      - name: Install ORAS
        if: inputs.push
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # tag=v2.0.2

      - name: Check attestation existence
        id: check-attestations
        if: inputs.push
        timeout-minutes: 3
        env:
          IMAGE_REF: ghcr.io/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
        run: |
          echo "Checking for existing attestations on platform image..."
          echo "Image reference: $IMAGE_REF"

          json="$(oras discover --format json "${IMAGE_REF}")"

          # Returns "true" or "false" (as text)
          has_pred() {
            local predicate="$1"
            jq -r --arg p "${predicate}" '
              any(.referrers[]?; .annotations["dev.sigstore.bundle.predicateType"] == $p)
            ' <<<"${json}"
          }

          echo "has_provenance=$(has_pred "${PREDICATE_TYPE_PROVENANCE}")" >> "${GITHUB_OUTPUT}"
          echo "has_sbom=$(has_pred "${PREDICATE_TYPE_SBOM}")" >> "${GITHUB_OUTPUT}"
          echo "has_vuln=$(has_pred "${PREDICATE_TYPE_VULN}")" >> "${GITHUB_OUTPUT}"
          echo "has_build_env=$(has_pred "${PREDICATE_TYPE_BUILD_ENV}")" >> "${GITHUB_OUTPUT}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          if-no-files-found: error
          name: >-
            digests-${{
              steps.digest.outputs.image-slug
            }}-${{
              steps.digest.outputs.platform-slug
            }}
          path: /tmp/digests/*
          retention-days: 1

      - name: Configure VEX
        if: inputs.push && inputs.vex-file != ''
        env:
          VEX_FILE: ${{ inputs.vex-file }}
        run: |
          # Setting TRIVY_VEX only when a document is supplied avoids Trivy
          # trying to load an empty path.
          echo "TRIVY_VEX=${VEX_FILE}" >> "$GITHUB_ENV"

      # Scan platform image
      - name: Run Trivy vulnerability scanner (SARIF)
        id: trivy-sarif
        if: inputs.push && steps.check-attestations.outputs.has_vuln != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # tag=v0.36.0
        with:
          exit-code: ${{ inputs.scan-severity != '' && '1' || '0' }}
          format: sarif
          ignore-unfixed: true
          image-ref: ghcr.io/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          limit-severities-for-sarif: true
          output: trivy-results-${{ strategy.job-index }}.sarif
          severity: ${{ inputs.scan-severity }}
          vuln-type: os,library
        continue-on-error: true

      - name: Run Trivy vulnerability scanner (JSON)
        id: trivy-json
        if: inputs.push && steps.check-attestations.outputs.has_vuln != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # tag=v0.36.0
        with:
          exit-code: 0
          format: json
          ignore-unfixed: true
          image-ref: ghcr.io/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          output: trivy-results-${{ strategy.job-index }}.json
          vuln-type: os,library

      - name: Run Trivy vulnerability scanner (table)
        if: inputs.push && steps.check-attestations.outputs.has_vuln != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # tag=v0.36.0
        with:
          exit-code: 0
          format: table
          ignore-unfixed: true
          image-ref: ghcr.io/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          vuln-type: os,library

      - name: Upload scan results
        if: inputs.push && steps.check-attestations.outputs.has_vuln != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: >-
            security-scan-results-${{
              steps.digest.outputs.image-slug
            }}-${{
              steps.digest.outputs.platform-slug
            }}
          path: |
            trivy-results-${{ strategy.job-index }}.sarif
          retention-days: 30

      - name: Upload SARIF to GitHub Security
        if: inputs.push && inputs.upload-scan-results &&
          steps.check-attestations.outputs.has_vuln != 'true'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # tag=codeql-bundle-v4.38.3
        with:
          category: container-scan-${{ matrix.platform }}
          sarif_file: trivy-results-${{ strategy.job-index }}.sarif

      - name: Fail if vulnerabilities found
        if: inputs.push && steps.check-attestations.outputs.has_vuln != 'true' &&
          steps.trivy-sarif.outcome == 'failure'
        env:
          PLATFORM: ${{ matrix.platform }}
          SCAN_SEVERITY: ${{ inputs.scan-severity }}
        run: |
          echo "::error::Security scan failed for ${PLATFORM} - vulnerabilities found above threshold: ${SCAN_SEVERITY}"
          exit 1

      - name: Attest vulnerability scan results
        id: attest-vuln-scan
        if: inputs.push && steps.check-attestations.outputs.has_vuln != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # tag=v4.2.2
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: ${{ env.PREDICATE_TYPE_VULN }}
          predicate-path: trivy-results-${{ strategy.job-index }}.json
          push-to-registry: true
        continue-on-error: true

      # Generate attestations for platform
      - name: Generate SBOM with Syft
        id: generate-sbom
        if: inputs.push && steps.check-attestations.outputs.has_sbom != 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # tag=v0.24.3
        with:
          image: ghcr.io/${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ strategy.job-index }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        if: inputs.push && steps.check-attestations.outputs.has_sbom != 'true'
        # actions/attest-sbom is deprecated; actions/attest detects the SPDX
        # format from sbom-path and applies the same predicate type.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # tag=v4.2.2
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ strategy.job-index }}.spdx.json
          push-to-registry: true

      - name: Upload SBOM artifact
        if: steps.generate-sbom.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: >-
            sbom-${{
              steps.digest.outputs.image-slug
            }}-${{
              steps.digest.outputs.platform-slug
            }}
          path: sbom-${{ strategy.job-index }}.spdx.json
          retention-days: 90

      - name: Clean up secret files
        if: always()
        run: |
          rm -f /tmp/build-secret-*

      - name: Output platform build summary
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CACHE_SCOPE: ${{ steps.cache-scope.outputs.scope }}
          HAS_SBOM: ${{ steps.check-attestations.outputs.has_sbom }}
          HAS_VULN: ${{ steps.check-attestations.outputs.has_vuln }}
          SOURCE_DATE_EPOCH: ${{ inputs.source-date-epoch }}
        run: |
          echo "## Platform Build Complete: ${PLATFORM}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Cache Scope:** \`${CACHE_SCOPE}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${HAS_SBOM}" = "true" ] || [ "${HAS_VULN}" = "true" ]; then
            echo "### ⏭️  Attestations Already Exist" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Skipped work for existing attestations:" >> $GITHUB_STEP_SUMMARY

            if [ "${HAS_VULN}" = "true" ]; then
              echo "- ✓ Vulnerability scanning (attestation exists)" >> $GITHUB_STEP_SUMMARY
            fi

            if [ "${HAS_SBOM}" = "true" ]; then
              echo "- ✓ SBOM generation (attestation exists)" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Reproducibility Information" >> $GITHUB_STEP_SUMMARY
          echo "**SOURCE_DATE_EPOCH:** \`${SOURCE_DATE_EPOCH}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This build uses deterministic timestamps for reproducibility." >> $GITHUB_STEP_SUMMARY
          echo "Rebuilding the same commit with the same inputs should produce the same digest." >> $GITHUB_STEP_SUMMARY
