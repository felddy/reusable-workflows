---
name: Container Build Workflow

# This reusable workflow builds OCI-compliant container images with modern
# supply chain security features.

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      # Required
      platforms:
        description: Platforms to build (comma-separated linux/amd64,linux/arm64)
        required: true
        type: string

      # Image Configuration
      image-name:
        description: Container image name (without registry)
        required: false
        type: string
        default: ${{ github.repository }}

      # Build Configuration
      context:
        description: Build context path
        required: false
        type: string
        default: .

      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: ./Dockerfile

      build-args:
        description: Build arguments (multiline string, KEY=VALUE per line)
        required: false
        type: string
        default: ""

      target:
        description: Build target for multi-stage builds
        required: false
        type: string
        default: ""

      # Advanced Build
      bake-file:
        description: Path to buildx bake file (HCL/JSON)
        required: false
        type: string
        default: ""

      bake-targets:
        description: Bake targets to build (comma-separated)
        required: false
        type: string
        default: ""

      # Features
      enable-attestations:
        description: Generate SLSA provenance and attestations
        required: false
        type: boolean
        default: true

      enable-sbom:
        description: Generate and attach SBOM
        required: false
        type: boolean
        default: true

      enable-signing:
        description: Sign images with cosign
        required: false
        type: boolean
        default: false

      enable-scanning:
        description: Scan images for vulnerabilities
        required: false
        type: boolean
        default: true

      scan-severity:
        description: Fail on vulnerabilities at or above this severity
        required: false
        type: string
        default: CRITICAL,HIGH

      # Caching
      cache-scope:
        description: Cache scope for this build
        required: false
        type: string
        default: ""

      # Debug
      debug:
        description: Enable debug mode (verbose logging)
        required: false
        type: boolean
        default: false

    secrets:
      signing-key:
        description: Cosign signing key
        required: false

      # Build secrets - pass individually for proper redaction
      # CRITICAL: Do NOT use JSON/XML/YAML blobs as secret values
      # GitHub cannot properly redact structured data
      # See: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
      build-secret-1:
        description: Build secret 1 (individual secret for proper redaction)
        required: false

      build-secret-2:
        description: Build secret 2 (individual secret for proper redaction)
        required: false

      build-secret-3:
        description: Build secret 3 (individual secret for proper redaction)
        required: false

      build-secret-4:
        description: Build secret 4 (individual secret for proper redaction)
        required: false

      build-secret-5:
        description: Build secret 5 (individual secret for proper redaction)
        required: false

      private-package-token:
        description: Token for private package authentication (use instead of GITHUB_TOKEN for private builds)
        required: false

    outputs:
      image-digest:
        description: Image digest (sha256:...)
        value: ${{ jobs.manifest.outputs.digest }}

      image-tags:
        description: Generated image tags
        value: ${{ jobs.metadata.outputs.image-tags }}

      image-version:
        description: Calculated version
        value: ${{ jobs.metadata.outputs.version }}

      full-image-name:
        description: Full image name with registry
        value: ghcr.io/${{ inputs.image-name }}

jobs:
  # Generate unique workflow call ID for artifact deconfliction
  generate-id:
    name: Generate Workflow Call ID
    runs-on: ubuntu-latest
    outputs:
      workflow-call-id: ${{ steps.generate.outputs.id }}
    steps:
      - name: Generate unique ID
        id: generate
        run: |
          # Create a unique ID based on image name and run info
          # This ensures each workflow call has unique artifacts
          UNIQUE_ID=$(echo "${{ inputs.image-name }}-${{ github.run_id }}-${{ github.run_attempt }}" | sha256sum | cut -c1-8)
          echo "id=$UNIQUE_ID" >> $GITHUB_OUTPUT
          echo "Workflow call ID: $UNIQUE_ID (use this for all artifacts)"

  # Parse platforms for matrix strategy
  parse-platforms:
    name: Parse Platforms
    runs-on: ubuntu-latest
    needs:
      - generate-id
    outputs:
      platforms: ${{ steps.parse.outputs.platforms }}
    steps:
      - name: Parse platform list
        id: parse
        run: |
          # Convert comma-separated platforms to JSON array
          PLATFORMS="${{ inputs.platforms }}"

          # Split by comma and create JSON array
          IFS=',' read -ra PLATFORM_ARRAY <<< "$PLATFORMS"

          # Trim whitespace and build JSON array
          JSON_ARRAY="["
          FIRST=true
          for platform in "${PLATFORM_ARRAY[@]}"; do
            # Trim whitespace
            platform=$(echo "$platform" | xargs)

            if [[ "$FIRST" == "true" ]]; then
              JSON_ARRAY="${JSON_ARRAY}\"${platform}\""
              FIRST=false
            else
              JSON_ARRAY="${JSON_ARRAY},\"${platform}\""
            fi
          done
          JSON_ARRAY="${JSON_ARRAY}]"

          echo "platforms=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "Parsed platforms: $JSON_ARRAY"

  # Determine visibility based on presence of private-package-token
  determine-visibility:
    name: Determine Visibility
    runs-on: ubuntu-latest
    needs:
      - generate-id
    outputs:
      link-repository: ${{ steps.check.outputs.link-repository }}
      is-private: ${{ steps.check.outputs.is-private }}
    steps:
      - name: Check for private package token
        id: check
        run: |
          # If private-package-token is provided, package is private (unlinked)
          # Otherwise, package is public (linked to repository)
          if [[ -n "${{ secrets.private-package-token }}" ]]; then
            echo "link-repository=false" >> $GITHUB_OUTPUT
            echo "is-private=true" >> $GITHUB_OUTPUT
            echo "Private package mode: will NOT link to repository"
          else
            echo "link-repository=true" >> $GITHUB_OUTPUT
            echo "is-private=false" >> $GITHUB_OUTPUT
            echo "Public package mode: will link to repository"
          fi

  # Generate metadata (tags, labels, version)
  metadata:
    name: Generate Metadata
    needs:
      - generate-id
      - determine-visibility
    uses: ./.github/workflows/container-metadata.yml
    with:
      image-name: ${{ inputs.image-name }}
      link-repository: ${{ needs.determine-visibility.outputs.link-repository == 'true' }}

  # Build container image (multi-architecture support)
  build:
    name: Build ${{ matrix.platform }}
    needs:
      - generate-id
      - parse-platforms
      - metadata
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Use parsed platforms for parallel builds
        # This enables per-platform caching and parallel execution
        platform: ${{ fromJSON(needs.parse-platforms.outputs.platforms) }}

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # tag=v6.0.2

      - name: Enable debug mode
        if: inputs.debug == true
        run: |
          echo "BUILDKIT_PROGRESS=plain" >> $GITHUB_ENV
          echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
          echo "Debug mode enabled - verbose logging active"

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # tag=v3.3.0
        with:
          platforms: ${{ inputs.platforms }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # tag=v3.12.0
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # tag=v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}

      - name: Validate required inputs
        run: |
          EXIT_CODE=0

          echo "::group::Validating inputs"

          # Validate platforms
          if [[ -z "${{ inputs.platforms }}" ]]; then
            echo "::error::platforms input is required"
            echo "::error::Example: platforms: linux/amd64,linux/arm64"
            EXIT_CODE=1
          else
            echo "✓ Platforms: ${{ inputs.platforms }}"
          fi

          # Validate image name
          if [[ -z "${{ inputs.image-name }}" ]]; then
            echo "::error::image-name input is required"
            echo "::error::Example: image-name: \${{ github.repository }}"
            EXIT_CODE=1
          else
            echo "✓ Image name: ${{ inputs.image-name }}"
          fi

          # Validate Dockerfile exists
          if [[ ! -f "${{ inputs.dockerfile }}" ]]; then
            echo "::error::Dockerfile not found at: ${{ inputs.dockerfile }}"
            echo "::error::Common issues:"
            echo "::error::  - Check the dockerfile input parameter"
            echo "::error::  - Ensure the file exists in the repository"
            echo "::error::  - Verify the path is relative to the repository root"
            echo "::error::  - Check for typos in the filename"
            EXIT_CODE=1
          else
            echo "✓ Dockerfile found: ${{ inputs.dockerfile }}"
          fi

          # Validate build context exists
          if [[ ! -d "${{ inputs.context }}" ]]; then
            echo "::error::Build context not found at: ${{ inputs.context }}"
            echo "::error::The context must be a directory containing the files to build"
            EXIT_CODE=1
          else
            echo "✓ Build context: ${{ inputs.context }}"
          fi

          # Validate scan severity format
          SEVERITY="${{ inputs.scan-severity }}"
          if [[ -n "$SEVERITY" ]]; then
            # Check if severity contains valid values
            if [[ ! "$SEVERITY" =~ ^(CRITICAL|HIGH|MEDIUM|LOW|UNKNOWN)(,(CRITICAL|HIGH|MEDIUM|LOW|UNKNOWN))*$ ]]; then
              echo "::warning::scan-severity format may be invalid: $SEVERITY"
              echo "::warning::Expected format: CRITICAL,HIGH,MEDIUM,LOW"
            else
              echo "✓ Scan severity: $SEVERITY"
            fi
          fi

          # Validate bake file if specified
          if [[ -n "${{ inputs.bake-file }}" ]]; then
            if [[ ! -f "${{ inputs.bake-file }}" ]]; then
              echo "::error::Bake file not found at: ${{ inputs.bake-file }}"
              EXIT_CODE=1
            else
              echo "✓ Bake file: ${{ inputs.bake-file }}"
            fi
          fi

          # Validate target if specified
          if [[ -n "${{ inputs.target }}" ]]; then
            echo "✓ Build target: ${{ inputs.target }}"
          fi

          # Check for common misconfigurations
          if [[ "${{ inputs.enable-signing }}" == "true" ]] && [[ -z "${{ secrets.signing-key }}" ]]; then
            echo "::warning::Image signing enabled but no signing-key secret provided"
            echo "::warning::Keyless signing will be used (requires OIDC token)"
          fi

          if [[ "${{ inputs.enable-attestations }}" == "false" ]] && [[ "${{ inputs.enable-sbom }}" == "true" ]]; then
            echo "::warning::SBOM generation enabled but attestations disabled"
            echo "::warning::SBOM will be generated but not attached as attestation"
          fi

          echo "::endgroup::"

          if [[ $EXIT_CODE -ne 0 ]]; then
            echo ""
            echo "::error::Validation failed. Please fix the errors above and try again."
            echo ""
            echo "## Validation Failed ❌" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the workflow logs for detailed error messages." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Common Issues" >> $GITHUB_STEP_SUMMARY
            echo "- Missing required inputs (platforms, image-name)" >> $GITHUB_STEP_SUMMARY
            echo "- Dockerfile not found at specified path" >> $GITHUB_STEP_SUMMARY
            echo "- Build context directory doesn't exist" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Documentation" >> $GITHUB_STEP_SUMMARY
            echo "See [USAGE.md](../../USAGE.md) for detailed parameter documentation." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ All validations passed"

      - name: Parse build arguments
        id: parse-args
        run: |
          # Parse multiline build-args into format for docker build
          BUILD_ARGS="${{ inputs.build-args }}"

          if [[ -n "$BUILD_ARGS" ]]; then
            # Use a delimiter for multiline output
            delimiter="$(openssl rand -hex 8)"
            echo "args<<${delimiter}" >> $GITHUB_OUTPUT
            echo "$BUILD_ARGS" >> $GITHUB_OUTPUT
            echo "${delimiter}" >> $GITHUB_OUTPUT

            echo "Build arguments parsed successfully"
          else
            echo "args=" >> $GITHUB_OUTPUT
            echo "No build arguments provided"
          fi

      - name: Prepare build secrets
        id: secrets
        run: |
          # Prepare secrets for BuildKit secret mounts
          # Each secret is passed individually for proper GitHub redaction
          SECRETS=""

          if [[ -n "${{ secrets.build-secret-1 }}" ]]; then
            echo "${{ secrets.build-secret-1 }}" > /tmp/build-secret-1
            SECRETS="$SECRETS,id=build-secret-1,src=/tmp/build-secret-1"
          fi

          if [[ -n "${{ secrets.build-secret-2 }}" ]]; then
            echo "${{ secrets.build-secret-2 }}" > /tmp/build-secret-2
            SECRETS="$SECRETS,id=build-secret-2,src=/tmp/build-secret-2"
          fi

          if [[ -n "${{ secrets.build-secret-3 }}" ]]; then
            echo "${{ secrets.build-secret-3 }}" > /tmp/build-secret-3
            SECRETS="$SECRETS,id=build-secret-3,src=/tmp/build-secret-3"
          fi

          if [[ -n "${{ secrets.build-secret-4 }}" ]]; then
            echo "${{ secrets.build-secret-4 }}" > /tmp/build-secret-4
            SECRETS="$SECRETS,id=build-secret-4,src=/tmp/build-secret-4"
          fi

          if [[ -n "${{ secrets.build-secret-5 }}" ]]; then
            echo "${{ secrets.build-secret-5 }}" > /tmp/build-secret-5
            SECRETS="$SECRETS,id=build-secret-5,src=/tmp/build-secret-5"
          fi

          # Remove leading comma if present
          SECRETS="${SECRETS#,}"

          echo "secrets=$SECRETS" >> $GITHUB_OUTPUT

          if [[ -n "$SECRETS" ]]; then
            echo "Build secrets prepared (count: $(echo $SECRETS | tr ',' '\n' | wc -l))"
          fi

      - name: Prepare platform-specific cache scope
        id: cache-scope
        run: |
          # Create platform-specific cache scope for better cache hits
          PLATFORM="${{ matrix.platform }}"
          PLATFORM_SLUG="${PLATFORM//\//-}"  # Replace / with -

          BASE_SCOPE="${{ inputs.cache-scope || 'build' }}"
          PLATFORM_SCOPE="${BASE_SCOPE}-${PLATFORM_SLUG}"

          echo "scope=$PLATFORM_SCOPE" >> $GITHUB_OUTPUT
          echo "Cache scope: $PLATFORM_SCOPE"

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # tag=v6.10.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.metadata.outputs.image-labels }}
          annotations: ${{ needs.metadata.outputs.annotations }}
          build-args: ${{ steps.parse-args.outputs.args }}
          target: ${{ inputs.target }}
          cache-from: type=gha,scope=${{ steps.cache-scope.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.cache-scope.outputs.scope }}
          provenance: ${{ inputs.enable-attestations }}
          sbom: ${{ inputs.enable-sbom }}
          secrets: ${{ steps.secrets.outputs.secrets }}
          outputs: type=image,name=ghcr.io/${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=true
        continue-on-error: true

      - name: Check build status
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Container build failed for platform: ${{ matrix.platform }}"
          echo "::error::Common build failures:"
          echo "::error::  - Syntax errors in Dockerfile"
          echo "::error::  - Missing files in build context"
          echo "::error::  - Invalid base image or tag"
          echo "::error::  - Network issues downloading dependencies"
          echo "::error::  - Insufficient disk space"
          echo "::error::  - Build argument or secret issues"
          echo ""
          echo "## Build Failed ❌" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** \`${{ matrix.platform }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Troubleshooting Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Check the build logs above for specific error messages" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify Dockerfile syntax is correct" >> $GITHUB_STEP_SUMMARY
          echo "3. Ensure all required files are in the build context" >> $GITHUB_STEP_SUMMARY
          echo "4. Check that base image exists and is accessible" >> $GITHUB_STEP_SUMMARY
          echo "5. Verify build arguments and secrets are correct" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Debug Mode" >> $GITHUB_STEP_SUMMARY
          echo "Enable debug mode for verbose logging:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
          echo "with:" >> $GITHUB_STEP_SUMMARY
          echo "  debug: true" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Export digest
        id: digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "digest=$digest" >> $GITHUB_OUTPUT

      - name: Upload digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # tag=v6.0.0
        with:
          name: digests-${{ needs.generate-id.outputs.workflow-call-id }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Clean up secret files
        if: always()
        run: |
          rm -f /tmp/build-secret-*

      - name: Output platform build summary
        run: |
          echo "## Platform Build Complete: ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Cache Scope:** \`${{ steps.cache-scope.outputs.scope }}\`" >> $GITHUB_STEP_SUMMARY

  # Create multi-platform manifest
  manifest:
    name: Create Multi-Platform Manifest
    needs:
      - generate-id
      - parse-platforms
      - metadata
      - build
      - determine-visibility
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.manifest.outputs.digest }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download all digests
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # tag=v4.1.8
        with:
          path: /tmp/digests
          pattern: digests-${{ needs.generate-id.outputs.workflow-call-id }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # tag=v3.12.0

      - name: Log in to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # tag=v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        id: manifest
        working-directory: /tmp/digests
        run: |
          # Collect all platform digests
          DIGESTS=""
          DIGEST_COUNT=0
          for digest_file in *; do
            if [[ -f "$digest_file" ]]; then
              DIGESTS="$DIGESTS ghcr.io/${{ inputs.image-name }}@sha256:${digest_file}"
              DIGEST_COUNT=$((DIGEST_COUNT + 1))
            fi
          done

          if [[ $DIGEST_COUNT -eq 0 ]]; then
            echo "::error::No platform digests found"
            echo "::error::This usually means all platform builds failed"
            exit 1
          fi

          echo "Found $DIGEST_COUNT platform digest(s)"

          # Create manifest for each tag
          TAGS="${{ needs.metadata.outputs.image-tags }}"

          # Convert newline-separated tags to array
          IFS=$'\n' read -rd '' -a TAG_ARRAY <<< "$TAGS" || true

          MANIFEST_DIGEST=""
          TAG_COUNT=0
          for tag in "${TAG_ARRAY[@]}"; do
            if [[ -n "$tag" ]]; then
              TAG_COUNT=$((TAG_COUNT + 1))
              echo "::group::Creating manifest for $tag"

              if docker buildx imagetools create \
                --tag "$tag" \
                $DIGESTS; then
                echo "✓ Manifest created for $tag"
              else
                echo "::error::Failed to create manifest for $tag"
                echo "::endgroup::"
                exit 1
              fi

              echo "::endgroup::"

              # Get the digest of the manifest (same for all tags)
              if [[ -z "$MANIFEST_DIGEST" ]]; then
                # Use docker manifest inspect to get the digest more reliably
                MANIFEST_DIGEST=$(docker manifest inspect "$tag" 2>/dev/null | jq -r '.manifests[0].digest // empty' 2>/dev/null || echo "")

                # Fallback to buildx imagetools if jq fails or returns empty
                if [[ -z "$MANIFEST_DIGEST" ]]; then
                  MANIFEST_DIGEST=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' 2>&1 | grep -E '^sha256:' | head -n1 || echo "")
                fi

                if [[ -z "$MANIFEST_DIGEST" ]]; then
                  echo "::warning::Could not extract manifest digest from $tag"
                fi
              fi
            fi
          done

          if [[ -z "$MANIFEST_DIGEST" ]]; then
            echo "::error::Failed to get manifest digest"
            exit 1
          fi

          # Validate digest format (should be sha256:...)
          if [[ ! "$MANIFEST_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid manifest digest format: $MANIFEST_DIGEST"
            echo "::error::Expected format: sha256:<64 hex characters>"
            exit 1
          fi

          echo "digest=$MANIFEST_DIGEST" >> $GITHUB_OUTPUT
          echo "✅ Multi-platform manifest created: $MANIFEST_DIGEST"
          echo "Created $TAG_COUNT tag(s) for $DIGEST_COUNT platform(s)"

      - name: Inspect manifest
        run: |
          FIRST_TAG=$(echo "${{ needs.metadata.outputs.image-tags }}" | head -n1)
          echo "::group::Manifest Details"
          docker buildx imagetools inspect "$FIRST_TAG" || true
          echo "::endgroup::"

      - name: Output manifest summary
        run: |
          echo "## Multi-Platform Manifest Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ inputs.image-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Manifest Digest:** \`${{ steps.manifest.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** \`${{ inputs.platforms }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.determine-visibility.outputs.link-repository }}" == "false" ]]; then
            echo "### 🔒 Private Package" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This image is private because it is NOT linked to the repository." >> $GITHUB_STEP_SUMMARY
            echo "The \`org.opencontainers.image.source\` label was omitted, so the package:" >> $GITHUB_STEP_SUMMARY
            echo "- Is scoped to the user/org account (not the repository)" >> $GITHUB_STEP_SUMMARY
            echo "- Is private by default" >> $GITHUB_STEP_SUMMARY
            echo "- Will NOT appear on the repository packages page" >> $GITHUB_STEP_SUMMARY
            echo "- Access is controlled via package permissions" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**To pull this private image:**" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "echo \$PAT | docker login ghcr.io -u USERNAME --password-stdin" >> $GITHUB_STEP_SUMMARY
            FIRST_TAG=$(echo "${{ needs.metadata.outputs.image-tags }}" | head -n1)
            echo "docker pull $FIRST_TAG" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          FIRST_TAG=$(echo "${{ needs.metadata.outputs.image-tags }}" | head -n1)
          echo "docker pull $FIRST_TAG" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verify Multi-Arch" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker buildx imagetools inspect $FIRST_TAG" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Security scanning
  scan:
    name: Security Scan
    needs:
      - generate-id
      - metadata
      - manifest
    if: inputs.enable-scanning == true
    uses: ./.github/workflows/container-scan.yml
    with:
      image-ref: ghcr.io/${{ inputs.image-name }}@${{ needs.manifest.outputs.digest }}
      scan-severity: ${{ inputs.scan-severity }}
      fail-on-vulnerabilities: true
      artifact-prefix: ${{ needs.generate-id.outputs.workflow-call-id }}
    secrets:
      private-package-token: ${{ secrets.private-package-token }}

  # Generate attestations (SLSA provenance, SBOM)
  attest:
    name: Generate Attestations
    needs:
      - generate-id
      - metadata
      - manifest
      - scan
    # Run if attestations OR sbom is enabled
    # Skip scan dependency if scanning is disabled
    if: |
      always() &&
      (inputs.enable-attestations == true || inputs.enable-sbom == true) &&
      (needs.scan.result == 'success' || needs.scan.result == 'skipped') &&
      needs.manifest.result == 'success'
    uses: ./.github/workflows/container-attest.yml
    with:
      image-ref: ghcr.io/${{ inputs.image-name }}@${{ needs.manifest.outputs.digest }}
      image-name: ${{ inputs.image-name }}
      registry: ghcr.io
      enable-provenance: ${{ inputs.enable-attestations }}
      enable-sbom: ${{ inputs.enable-sbom }}
      sbom-formats: both
      attach-scan-results: ${{ inputs.enable-scanning }}
      push-to-registry: true
      artifact-prefix: ${{ needs.generate-id.outputs.workflow-call-id }}
    secrets:
      private-package-token: ${{ secrets.private-package-token }}

  # Sign container image
  sign:
    name: Sign Container Image
    needs:
      - metadata
      - manifest
      - scan
      - attest
    # Run if signing is enabled
    # Skip scan and attest dependencies if they're disabled
    if: |
      always() &&
      inputs.enable-signing == true &&
      (needs.scan.result == 'success' || needs.scan.result == 'skipped') &&
      (needs.attest.result == 'success' || needs.attest.result == 'skipped') &&
      needs.manifest.result == 'success'
    uses: ./.github/workflows/container-sign.yml
    with:
      image-ref: ghcr.io/${{ inputs.image-name }}@${{ needs.manifest.outputs.digest }}
      image-name: ${{ inputs.image-name }}
      registry: ghcr.io
      use-keyless: true
    secrets:
      signing-key: ${{ secrets.signing-key }}
      private-package-token: ${{ secrets.private-package-token }}
