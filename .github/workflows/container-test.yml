---
name: Test container image

# This reusable workflow tests a container image by pulling it directly from
# the registry using a digest reference resolved from the per-platform digest
# artifacts uploaded by container-build.yml.  No tar artifact loading is
# required; the tested image is identical to what will be published.
#
# The workflow fans out across all requested platforms using a matrix strategy
# mirroring the pattern used in container-build.yml.  QEMU emulation is set up
# per matrix job so non-native platforms can be tested on ubuntu-latest runners.

# Permissions are set at the job level; default to none at workflow level.
permissions: {}

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      # Required inputs
      image-name:
        description: Container image name without registry (e.g. owner/image)
        required: true
        type: string

      platforms:
        description: >
          JSON array of platforms to test
          (e.g. '["linux/amd64"]' or '["linux/amd64","linux/arm64"]').
          The workflow resolves the registry reference for each platform
          from the digest artifacts uploaded by container-build.yml and
          fans out test jobs across all listed platforms in parallel.
        required: true
        type: string

      # Optional inputs
      registry:
        description: Container registry hostname
        required: false
        type: string
        default: ghcr.io

      retention-days:
        description: Days to retain the test results artifact
        required: false
        type: number
        default: 7

      python-version:
        description: Python version for running pytest
        required: false
        type: string
        default: "3.14"

      # Test secret names — controls the environment variable name exposed to pytest.
      # Pair each with the corresponding test-secret-N secret value.
      test-secret-1-name:
        description: Environment variable name for test-secret-1
        required: false
        type: string
        default: ""

      test-secret-2-name:
        description: Environment variable name for test-secret-2
        required: false
        type: string
        default: ""

      test-secret-3-name:
        description: Environment variable name for test-secret-3
        required: false
        type: string
        default: ""

      test-secret-4-name:
        description: Environment variable name for test-secret-4
        required: false
        type: string
        default: ""

      test-secret-5-name:
        description: Environment variable name for test-secret-5
        required: false
        type: string
        default: ""

    secrets:
      registry-token:
        description: >
          Token for pulling from the registry. Defaults to GITHUB_TOKEN.
          Use a PAT with packages:read for private images not linked to
          this repository.
        required: false

      test-secret-1:
        description: Secret value exposed to pytest as the env var named by test-secret-1-name
        required: false

      test-secret-2:
        description: Secret value exposed to pytest as the env var named by test-secret-2-name
        required: false

      test-secret-3:
        description: Secret value exposed to pytest as the env var named by test-secret-3-name
        required: false

      test-secret-4:
        description: Secret value exposed to pytest as the env var named by test-secret-4-name
        required: false

      test-secret-5:
        description: Secret value exposed to pytest as the env var named by test-secret-5-name
        required: false

jobs:
  # Convert the platforms JSON array into a matrix for the test job.
  # This mirrors the pattern used in container-build.yml.
  generate-matrix:
    name: Generate platform matrix
    runs-on: ubuntu-latest

    permissions:
      contents: none

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # tag=v2.14.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            127.0.0.1

      - name: Set matrix
        id: set-matrix
        run: |
          # Map each platform to its native GitHub-hosted runner where available.
          # Falls back to ubuntu-latest (+ QEMU emulation) for platforms without
          # a native runner.
          PLATFORMS_JSON='${{ inputs.platforms }}'
          MATRIX=$(echo "${PLATFORMS_JSON}" | jq -c '
            map({
              platform: .,
              runner: (
                if . == "linux/arm64/v8" or . == "linux/arm64" then "ubuntu-24.04-arm"
                else "ubuntu-latest"
                end
              )
            }) | {include: .}
          ')
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT

  test:
    # Pulls the image from the registry by digest and runs pytest.
    name: Test ${{ matrix.platform }}
    needs: generate-matrix
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    permissions:
      actions: read
      contents: read
      packages: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # tag=v2.14.2
        with:
          egress-policy: audit
          allowed-endpoints: >
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443

      - name: Set up QEMU for multi-arch testing
        if: matrix.runner == 'ubuntu-latest'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # tag=v3.3.0
        with:
          platforms: all

      - name: Log in to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # tag=v3.7.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-token && github.repository_owner || github.actor }}
          password: ${{ secrets.registry-token || secrets.GITHUB_TOKEN }}

      # Download digest artifact by exact name per platform.
      # actions/download-artifact pattern input cannot be scoped tightly enough to
      # avoid matching sibling images with a shared slug prefix; gh run download
      # --name accepts exact names and works correctly in a dynamic loop.
      - name: Resolve image reference and pull
        id: resolve
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          REGISTRY: ${{ inputs.registry }}
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_SLUG=$(echo "${IMAGE_NAME}" | tr '/' '-')
          PLATFORM_SLUG=$(echo "${PLATFORM}" | tr '/' '-')
          ARTIFACT_NAME="digests-${IMAGE_SLUG}-${PLATFORM_SLUG}"
          ARTIFACT_DIR="/tmp/digests/${ARTIFACT_NAME}"

          echo "Downloading artifact: ${ARTIFACT_NAME}"
          mkdir -p /tmp/digests
          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${ARTIFACT_NAME}" \
            --dir "${ARTIFACT_DIR}"

          HEX=$(ls "${ARTIFACT_DIR}" | grep -E '^[a-f0-9]{64}$' || true)
          if [[ -z "${HEX}" ]]; then
            echo "::error::No valid sha256 digest file found in ${ARTIFACT_DIR}"
            exit 1
          fi
          if [[ $(echo "${HEX}" | wc -l) -gt 1 ]]; then
            echo "::error::Multiple digest files found in ${ARTIFACT_DIR}: ${HEX}"
            exit 1
          fi

          IMAGE_REF="${REGISTRY}/${IMAGE_NAME}@sha256:${HEX}"
          echo "Pulling ${IMAGE_REF} (platform: ${PLATFORM})"

          if ! docker pull "${IMAGE_REF}"; then
            echo "::error::Failed to pull ${IMAGE_REF} — check that the image was pushed and registry-token has packages:read"
            exit 1
          fi

          echo "IMAGE_REF=${IMAGE_REF}" >> $GITHUB_ENV
          echo "image-ref=${IMAGE_REF}" >> $GITHUB_OUTPUT
          echo "image-slug=${IMAGE_SLUG}" >> $GITHUB_OUTPUT
          echo "platform-slug=${PLATFORM_SLUG}" >> $GITHUB_OUTPUT
          echo "Resolved image reference: ${IMAGE_REF}"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # tag=v6.0.2

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # tag=v6.2.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache pip
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # tag=v5.0.3
        env:
          BASE_CACHE_KEY: "${{ github.job }}-${{ runner.os }}-\
            py${{ steps.setup-python.outputs.python-version }}-"
        with:
          path: ~/.cache/pip
          key: "${{ env.BASE_CACHE_KEY }}\
            ${{ hashFiles('**/requirements-test.txt') }}-\
            ${{ hashFiles('**/requirements.txt') }}"
          restore-keys: |
            ${{ env.BASE_CACHE_KEY }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --requirement requirements-test.txt

      - name: Prepare test secrets
        id: test-secrets
        run: |
          # Export each named secret as an environment variable for pytest.
          # Uses GITHUB_ENV so the values are available to subsequent steps
          # and properly masked in logs by GitHub's secret redaction.
          if [[ -n "${{ inputs.test-secret-1-name }}" && -n "${{ secrets.test-secret-1 }}" ]]; then
            echo "${{ inputs.test-secret-1-name }}=${{ secrets.test-secret-1 }}" >> $GITHUB_ENV
          fi
          if [[ -n "${{ inputs.test-secret-2-name }}" && -n "${{ secrets.test-secret-2 }}" ]]; then
            echo "${{ inputs.test-secret-2-name }}=${{ secrets.test-secret-2 }}" >> $GITHUB_ENV
          fi
          if [[ -n "${{ inputs.test-secret-3-name }}" && -n "${{ secrets.test-secret-3 }}" ]]; then
            echo "${{ inputs.test-secret-3-name }}=${{ secrets.test-secret-3 }}" >> $GITHUB_ENV
          fi
          if [[ -n "${{ inputs.test-secret-4-name }}" && -n "${{ secrets.test-secret-4 }}" ]]; then
            echo "${{ inputs.test-secret-4-name }}=${{ secrets.test-secret-4 }}" >> $GITHUB_ENV
          fi
          if [[ -n "${{ inputs.test-secret-5-name }}" && -n "${{ secrets.test-secret-5 }}" ]]; then
            echo "${{ inputs.test-secret-5-name }}=${{ secrets.test-secret-5 }}" >> $GITHUB_ENV
          fi

      - name: Run pytest
        env:
          PYTHONUNBUFFERED: 1
        run: |
          set -o pipefail
          pytest --image-tag "${IMAGE_REF}" --tb=short --junit-xml=test-results.xml 2>&1 | tee pytest.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # tag=v6.0.0
        with:
          name: >-
            test-results-${{
              steps.resolve.outputs.image-slug
            }}-${{
              steps.resolve.outputs.platform-slug
            }}-${{ github.run_id }}
          path: |
            test-results.xml
            pytest.log
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: ignore
