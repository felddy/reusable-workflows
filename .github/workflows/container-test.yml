---
name: Test container image

# This reusable workflow tests a container image by pulling it directly from
# the registry using a digest reference resolved from the per-platform digest
# artifacts uploaded by container-build.yml.  No tar artifact loading is
# required; the tested image is identical to what will be published.
#
# The workflow fans out across all requested platforms using a matrix strategy
# mirroring the pattern used in container-build.yml.  QEMU emulation is set up
# per matrix job so non-native platforms can be tested on ubuntu-latest runners.
#
# Python dependency installation supports both uv (preferred) and pip:
#   - auto (default): uses uv if uv.lock is present, otherwise pip
#   - uv: always use uv sync --frozen --only-group test
#   - pip: always use pip install --requirement requirements-test.txt

# Permissions are set at the job level; default to none at workflow level.
permissions: {}

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      # Required inputs
      image-name:
        description: Container image name without registry (e.g. owner/image)
        required: true
        type: string

      test-matrix:
        description: >
          Platform/runner matrix (JSON object string with an include list),
          produced by container-pipeline.yml's generate-matrix job. The
          workflow resolves the registry reference for each platform from
          the digest artifacts uploaded by container-build.yml and fans out
          test jobs across all listed platforms in parallel.
        required: true
        type: string

      # Optional inputs
      registry:
        description: Container registry hostname
        required: false
        type: string
        default: ghcr.io

      retention-days:
        description: Days to retain the test results artifact
        required: false
        type: number
        default: 7

      python-version:
        description: Python version for running pytest
        required: false
        type: string
        default: "3.14"

      package-manager:
        description: >
          Python package manager to use for installing test dependencies.
          'auto' detects based on the presence of uv.lock in the repository.
          'uv' always uses uv sync --frozen --only-group test.
          'pip' always uses pip install --requirement requirements-test.txt.
        required: false
        type: string
        default: auto

      # Test secret names — controls the environment variable name exposed to pytest.
      # Pair each with the corresponding test-secret-N secret value.
      test-secret-1-name:
        description: Environment variable name for test-secret-1
        required: false
        type: string
        default: ""

      test-secret-2-name:
        description: Environment variable name for test-secret-2
        required: false
        type: string
        default: ""

      test-secret-3-name:
        description: Environment variable name for test-secret-3
        required: false
        type: string
        default: ""

      test-secret-4-name:
        description: Environment variable name for test-secret-4
        required: false
        type: string
        default: ""

      test-secret-5-name:
        description: Environment variable name for test-secret-5
        required: false
        type: string
        default: ""

    secrets:
      private-package-token:
        description: >
          Token for pulling from the registry. Defaults to GITHUB_TOKEN.
          Use a PAT with packages:read for private images not linked to
          this repository.
        required: false

      private-package-username:
        description: >
          Username for private-package-token authentication. Defaults to
          github.repository_owner when absent.
        required: false

      test-secret-1:
        description: Secret value exposed to pytest as the env var named by test-secret-1-name
        required: false

      test-secret-2:
        description: Secret value exposed to pytest as the env var named by test-secret-2-name
        required: false

      test-secret-3:
        description: Secret value exposed to pytest as the env var named by test-secret-3-name
        required: false

      test-secret-4:
        description: Secret value exposed to pytest as the env var named by test-secret-4-name
        required: false

      test-secret-5:
        description: Secret value exposed to pytest as the env var named by test-secret-5-name
        required: false

jobs:
  test:
    # Pulls the image from the registry by digest and runs pytest.
    name: Test ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test-matrix) }}

    permissions:
      actions: read
      contents: read
      packages: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # tag=v2.22.2
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.osv.dev:443
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            mirror.gcr.io:443
            objects.githubusercontent.com:443
            pypi.org:443
            releases.astral.sh:443

      - name: Configure Docker registry mirror
        # Route docker.io pulls through mirror.gcr.io: mirror pulls do not
        # count against Docker Hub rate limits, and a cache miss falls back
        # to Docker Hub automatically. This is an inline step rather than a
        # local composite action because local action paths resolve against
        # the caller's checkout when this reusable workflow runs in another
        # repository. Keep in sync with the copy in container-build.yml.
        run: |
          if [[ -s /etc/docker/daemon.json ]]; then
            jq '."registry-mirrors" = ["https://mirror.gcr.io"]' /etc/docker/daemon.json > /tmp/daemon.json
          else
            jq -n '{"registry-mirrors": ["https://mirror.gcr.io"]}' > /tmp/daemon.json
          fi
          sudo mkdir -p /etc/docker
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
          echo "Docker daemon registry mirrors:"
          docker info --format '{{json .RegistryConfig.Mirrors}}'

      - name: Set up QEMU for multi-arch testing
        if: matrix.runner == 'ubuntu-latest'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # tag=v3.3.0
        with:
          platforms: all

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # tag=v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.private-package-token && (secrets.private-package-username
            || github.repository_owner) || github.actor }}
          password: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}

      # Download digest artifact by exact name per platform.
      # actions/download-artifact pattern input cannot be scoped tightly enough to
      # avoid matching sibling images with a shared slug prefix; gh run download
      # --name accepts exact names and works correctly in a dynamic loop.
      - name: Resolve image reference and pull
        id: resolve
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          REGISTRY: ${{ inputs.registry }}
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_SLUG=$(echo "${IMAGE_NAME}" | tr '/' '-')
          PLATFORM_SLUG=$(echo "${PLATFORM}" | tr '/' '-')
          ARTIFACT_NAME="digests-${IMAGE_SLUG}-${PLATFORM_SLUG}"
          ARTIFACT_DIR="/tmp/digests/${ARTIFACT_NAME}"

          echo "Downloading artifact: ${ARTIFACT_NAME}"
          mkdir -p /tmp/digests
          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${ARTIFACT_NAME}" \
            --dir "${ARTIFACT_DIR}"

          HEX=$(ls "${ARTIFACT_DIR}" | grep -E '^[a-f0-9]{64}$' || true)
          if [[ -z "${HEX}" ]]; then
            echo "::error::No valid sha256 digest file found in ${ARTIFACT_DIR}"
            exit 1
          fi
          if [[ $(echo "${HEX}" | wc -l) -gt 1 ]]; then
            echo "::error::Multiple digest files found in ${ARTIFACT_DIR}: ${HEX}"
            exit 1
          fi

          IMAGE_REF="${REGISTRY}/${IMAGE_NAME}@sha256:${HEX}"
          echo "Pulling ${IMAGE_REF} (platform: ${PLATFORM})"

          if ! docker pull "${IMAGE_REF}"; then
            echo "::error::Failed to pull ${IMAGE_REF} — check that the image was pushed and private-package-token has packages:read"
            exit 1
          fi

          echo "IMAGE_REF=${IMAGE_REF}" >> $GITHUB_ENV
          echo "image-ref=${IMAGE_REF}" >> $GITHUB_OUTPUT
          echo "image-slug=${IMAGE_SLUG}" >> $GITHUB_OUTPUT
          echo "platform-slug=${PLATFORM_SLUG}" >> $GITHUB_OUTPUT
          echo "Resolved image reference: ${IMAGE_REF}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false

      # Detect which package manager to use. Runs after checkout so uv.lock
      # is present on disk for the file existence check.
      - name: Detect package manager
        id: pkg-manager
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          if [[ "${PACKAGE_MANAGER}" == "uv" ]] || \
             { [[ "${PACKAGE_MANAGER}" == "auto" ]] && [[ -f uv.lock ]]; }; then
            echo "use-uv=true" >> $GITHUB_OUTPUT
            echo "Package manager: uv"
          else
            echo "use-uv=false" >> $GITHUB_OUTPUT
            echo "Package manager: pip"
          fi

      # ── uv path ────────────────────────────────────────────────────────────

      - name: Set up uv
        if: steps.pkg-manager.outputs.use-uv == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # tag=v10.3.0
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies (uv)
        if: steps.pkg-manager.outputs.use-uv == 'true'
        run: uv sync --frozen --only-group test

      # Expose the uv-managed venv to subsequent steps without requiring
      # 'uv run' prefixes everywhere.
      - name: Add venv to PATH (uv)
        if: steps.pkg-manager.outputs.use-uv == 'true'
        run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      # ── pip path ───────────────────────────────────────────────────────────

      - name: Set up Python
        if: steps.pkg-manager.outputs.use-uv == 'false'
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # tag=v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache pip
        if: steps.pkg-manager.outputs.use-uv == 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # tag=v6.1.0
        env:
          BASE_CACHE_KEY: "${{ github.job }}-${{ runner.os }}-\
            py${{ steps.setup-python.outputs.python-version }}-"
        with:
          path: ~/.cache/pip
          key: "${{ env.BASE_CACHE_KEY }}\
            ${{ hashFiles('**/requirements-test.txt') }}-\
            ${{ hashFiles('**/requirements.txt') }}"
          restore-keys: |
            ${{ env.BASE_CACHE_KEY }}

      - name: Install dependencies (pip)
        if: steps.pkg-manager.outputs.use-uv == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --requirement requirements-test.txt

      # ── shared path ────────────────────────────────────────────────────────

      - name: Prepare test secrets
        id: test-secrets
        env:
          TEST_SECRET_1: ${{ secrets.test-secret-1 }}
          TEST_SECRET_2: ${{ secrets.test-secret-2 }}
          TEST_SECRET_3: ${{ secrets.test-secret-3 }}
          TEST_SECRET_4: ${{ secrets.test-secret-4 }}
          TEST_SECRET_5: ${{ secrets.test-secret-5 }}
          TEST_SECRET_1_NAME: ${{ inputs.test-secret-1-name }}
          TEST_SECRET_2_NAME: ${{ inputs.test-secret-2-name }}
          TEST_SECRET_3_NAME: ${{ inputs.test-secret-3-name }}
          TEST_SECRET_4_NAME: ${{ inputs.test-secret-4-name }}
          TEST_SECRET_5_NAME: ${{ inputs.test-secret-5-name }}
        run: |
          # Export each named secret as an environment variable for pytest.
          # Uses GITHUB_ENV so the values are available to subsequent steps
          # and properly masked in logs by GitHub's secret redaction.
          for i in 1 2 3 4 5; do
            name_var="TEST_SECRET_${i}_NAME"
            value_var="TEST_SECRET_${i}"
            if [[ -n "${!name_var}" && -n "${!value_var}" ]]; then
              echo "${!name_var}=${!value_var}" >> $GITHUB_ENV
            fi
          done

      - name: Run pytest
        env:
          PYTHONUNBUFFERED: 1
        run: |
          set -o pipefail
          pytest --image-tag "${IMAGE_REF}" --tb=short --junit-xml=test-results.xml 2>&1 | tee pytest.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: >-
            test-results-${{
              steps.resolve.outputs.image-slug
            }}-${{
              steps.resolve.outputs.platform-slug
            }}-${{ github.run_id }}
          path: |
            test-results.xml
            pytest.log
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: ignore
