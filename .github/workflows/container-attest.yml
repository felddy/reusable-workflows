---
# Container Attestation Workflow
# Generates SLSA provenance and attestations for container images
# Supports custom attestation predicates and vulnerability scan results
#
# Note: BuildKit generates per-architecture SBOMs during the build process when
# sbom: true is set in build-push-action. These SBOMs are attached as attestation
# manifests to the multi-platform image index. Different architectures may have
# different dependencies, so per-architecture SBOMs are more accurate than a single
# SBOM. This workflow downloads those BuildKit-generated SBOMs and re-uploads them
# as signed GitHub Actions attestations, providing cryptographic verification.

name: Container Attestation

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      image-ref:
        description: Full image reference with digest (registry/name@sha256:...)
        required: true
        type: string

      image-name:
        description: Image name without registry (for subject-name)
        required: true
        type: string

      registry:
        description: Container registry (ghcr.io, docker.io, etc.)
        required: false
        type: string
        default: ghcr.io

      scan-results-path:
        description: Path to vulnerability scan results JSON file
        required: false
        type: string
        default: ""

      custom-predicate-type:
        description: Custom attestation predicate type URI
        required: false
        type: string
        default: ""

      custom-predicate-path:
        description: Path to custom attestation predicate JSON file
        required: false
        type: string
        default: ""

      artifact-prefix:
        description: Unique prefix for artifact names to prevent collisions in parallel builds
        required: false
        type: string
        default: ""

    secrets:
      private-package-token:
        description: Token for private package authentication (required for scanning private images)
        required: false

    outputs:
      attestation-digest:
        description: Digest of the attestation bundle
        value: ${{ jobs.attest.outputs.attestation-digest }}

      provenance-file:
        description: Path to provenance attestation file
        value: ${{ jobs.attest.outputs.provenance-file }}

      provenance-bundle-path:
        description: Path to provenance bundle
        value: ${{ jobs.attest.outputs.provenance-bundle-path }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  attest:
    name: Generate Attestations
    runs-on: ubuntu-latest

    outputs:
      attestation-digest: ${{ steps.attestation-digest.outputs.digest }}
      provenance-file: ${{ steps.provenance-paths.outputs.provenance-file }}
      provenance-bundle-path: ${{ steps.provenance.outputs.bundle-path }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # tag=v2.14.2
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # tag=v6.0.2

      - name: Set SOURCE_DATE_EPOCH for reproducible builds
        id: source-date-epoch
        run: |
          # Set SOURCE_DATE_EPOCH for deterministic timestamps
          # This ensures reproducible builds (same inputs produce identical outputs)
          # Use the commit timestamp for reproducibility
          if [ -d .git ]; then
            # Get the commit timestamp from git
            COMMIT_TIMESTAMP=$(git log -1 --format=%ct)
            echo "SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP" >> $GITHUB_ENV
            echo "source-date-epoch=$COMMIT_TIMESTAMP" >> $GITHUB_OUTPUT
            COMMIT_DATE=$(date -u -d "@$COMMIT_TIMESTAMP" '+%Y-%m-%d %H:%M:%S UTC')
            echo "Reproducible build timestamp: $COMMIT_DATE (epoch: $COMMIT_TIMESTAMP)"
          else
            # Fallback to Unix epoch (0) for reproducibility
            FALLBACK_TIMESTAMP=0
            echo "SOURCE_DATE_EPOCH=$FALLBACK_TIMESTAMP" >> $GITHUB_ENV
            echo "source-date-epoch=$FALLBACK_TIMESTAMP" >> $GITHUB_OUTPUT
            echo "::warning::Not in a git repository, using Unix epoch (0) for SOURCE_DATE_EPOCH"
          fi

      - name: Download scan results artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # tag=v4.1.8
        with:
          name: security-scan-results${{ inputs.artifact-prefix != '' && format('-{0}', inputs.artifact-prefix) || '' }}
          path: ./scan-results
        continue-on-error: true

      - name: Log in to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # tag=v3.7.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.private-package-token || secrets.GITHUB_TOKEN }}

      - name: Extract image digest
        id: digest
        run: |
          # Extract digest from image reference
          DIGEST="${{ inputs.image-ref }}"
          DIGEST="${DIGEST##*@}"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Extracted digest: $DIGEST"

      - name: Install crane
        run: |
          # Install crane for manifest inspection
          VERSION="v0.20.2"
          curl -sL "https://github.com/google/go-containerregistry/releases/download/${VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin crane
          crane version

      - name: Extract platform list and digests
        id: platforms
        run: |
          # Get the multi-platform manifest
          MANIFEST=$(crane manifest ${{ inputs.image-ref }})

          # Extract platform digests (filter out attestation manifests)
          # Attestation manifests have platform.os = "unknown"
          # Real platform manifests have platform.os = "linux"
          PLATFORMS=$(echo "$MANIFEST" | jq -r '
            .manifests[] |
            select(.platform.os == "linux") |
            {
              platform: (.platform.os + "/" + .platform.architecture + (if .platform.variant then "/" + .platform.variant else "" end)),
              digest: .digest
            }
          ' | jq -s '.')

          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT
          echo "Detected platforms:"
          echo "$PLATFORMS" | jq -r '.[] | "  - \(.platform) (\(.digest))"'

      - name: Download and sign BuildKit SBOMs
        run: |
          # Parse platforms JSON
          PLATFORMS='${{ steps.platforms.outputs.platforms }}'

          # Create a temporary file to track results
          RESULTS_FILE=$(mktemp)

          # For each platform, download SBOM and sign it
          echo "$PLATFORMS" | jq -c '.[]' | while read -r platform_info; do
            PLATFORM=$(echo "$platform_info" | jq -r '.platform')
            DIGEST=$(echo "$platform_info" | jq -r '.digest')

            # Convert platform string to filename-safe format (e.g., linux/amd64 -> linux-amd64)
            PLATFORM_SLUG=$(echo "$PLATFORM" | tr '/' '-')

            echo "Processing platform: $PLATFORM (digest: $DIGEST)"

            # Use the platform-specific image reference to extract the SBOM
            PLATFORM_IMAGE="${{ inputs.registry }}/${{ inputs.image-name }}@$DIGEST"

            # Extract SBOM using docker buildx imagetools inspect
            # Note: We inspect the platform-specific image, not the multi-platform manifest
            SBOM_JSON=$(docker buildx imagetools inspect "$PLATFORM_IMAGE" --format "{{ json .SBOM.SPDX }}" 2>/dev/null || echo "")

            if [ -n "$SBOM_JSON" ] && [ "$SBOM_JSON" != "null" ]; then
              # Save SBOM to file
              SBOM_FILE="sbom-${PLATFORM_SLUG}.spdx.json"
              echo "$SBOM_JSON" > "$SBOM_FILE"

              echo "✅ Downloaded SBOM for $PLATFORM ($(stat -c%s "$SBOM_FILE") bytes)"

              # Sign and upload SBOM as GitHub Actions attestation
              echo "Signing SBOM for $PLATFORM..."
              if gh attestation attest \
                --predicate-type https://spdx.dev/Document \
                --predicate "$SBOM_FILE" \
                --digest-alg sha256 \
                --subject "$PLATFORM_IMAGE" \
                --repo ${{ github.repository }}; then
                echo "✅ Signed and uploaded SBOM attestation for $PLATFORM"
                echo "success" >> "$RESULTS_FILE"
              else
                echo "::error::Failed to sign SBOM for $PLATFORM"
                echo "failure" >> "$RESULTS_FILE"
              fi
            else
              echo "⚠️  No SBOM found for $PLATFORM"
              echo "no-sbom" >> "$RESULTS_FILE"
            fi
          done

          # Check results
          if [ ! -f "$RESULTS_FILE" ] || [ ! -s "$RESULTS_FILE" ]; then
            echo "::error::No platforms processed"
            rm -f "$RESULTS_FILE"
            exit 1
          fi

          SUCCESS_COUNT=$(grep -c "success" "$RESULTS_FILE" || echo "0")
          FAILURE_COUNT=$(grep -c "failure" "$RESULTS_FILE" || echo "0")
          NO_SBOM_COUNT=$(grep -c "no-sbom" "$RESULTS_FILE" || echo "0")

          rm -f "$RESULTS_FILE"

          echo ""
          echo "SBOM Processing Summary:"
          echo "  ✅ Successfully signed: $SUCCESS_COUNT"
          echo "  ❌ Failed to sign: $FAILURE_COUNT"
          echo "  ⚠️  No SBOM found: $NO_SBOM_COUNT"

          if [ "$SUCCESS_COUNT" -eq 0 ]; then
            echo "::error::Failed to sign any SBOMs"
            exit 1
          fi

          if [ "$FAILURE_COUNT" -gt 0 ]; then
            echo "::warning::Some SBOMs failed to sign"
          fi

          echo "✅ Successfully signed $SUCCESS_COUNT SBOM(s)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate SLSA provenance
        id: provenance
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # tag=v1.4.3
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.image-name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Capture build environment metadata
        id: build-env
        run: |
          # Capture additional build environment details for reproducibility
          # This supplements the SLSA provenance with environment-specific information

          cat > build-environment.json <<EOF
          {
            "buildEnvironment": {
              "sourceRepository": "${{ github.repository }}",
              "sourceCommit": "${{ github.sha }}",
              "sourceRef": "${{ github.ref }}",
              "sourceDateEpoch": "${SOURCE_DATE_EPOCH:-}",
              "buildTimestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "builder": {
                "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "platform": "GitHub Actions",
                "runnerOS": "${{ runner.os }}",
                "runnerArch": "${{ runner.arch }}"
              },
              "tools": {
                "docker": "$(docker --version | cut -d' ' -f3 | tr -d ',')",
                "buildx": "$(docker buildx version | cut -d' ' -f2)",
                "git": "$(git --version | cut -d' ' -f3)"
              }
            }
          }
          EOF

          echo "Build environment metadata captured"
          cat build-environment.json | jq '.'

      - name: Attach build environment as custom attestation
        id: attest-build-env
        uses: actions/attest@e59cbc1ad1ac2d59339667419eb8cdde6eb61e3d # tag=v3.2.0
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.image-name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          predicate-type: https://github.com/felddy/reusable-workflows/build-environment/v1
          predicate-path: build-environment.json
          push-to-registry: true
        continue-on-error: true

      - name: Set provenance paths
        id: provenance-paths
        run: |
          echo "provenance-file=provenance.json" >> $GITHUB_OUTPUT

          # Extract provenance from bundle if available
          if [ -n "${{ steps.provenance.outputs.bundle-path }}" ]; then
            echo "Provenance bundle created at: ${{ steps.provenance.outputs.bundle-path }}"
          fi

      - name: Attach vulnerability scan results
        id: attest-scan
        uses: actions/attest@e59cbc1ad1ac2d59339667419eb8cdde6eb61e3d # tag=v3.2.0
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.image-name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          predicate-type: https://cosign.sigstore.dev/attestation/vuln/v1
          predicate-path: ${{ inputs.scan-results-path != '' && inputs.scan-results-path || './scan-results/trivy-results.json' }}
          push-to-registry: true
        continue-on-error: true

      - name: Attach custom attestation predicate
        id: attest-custom
        if: inputs.custom-predicate-type != '' && inputs.custom-predicate-path != ''
        uses: actions/attest@e59cbc1ad1ac2d59339667419eb8cdde6eb61e3d # tag=v3.2.0
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.image-name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          predicate-type: ${{ inputs.custom-predicate-type }}
          predicate-path: ${{ inputs.custom-predicate-path }}
          push-to-registry: true
        continue-on-error: true

      - name: Calculate attestation digest
        id: attestation-digest
        run: |
          # Create a combined hash of all attestations
          COMBINED=""

          if [ -n "${{ steps.provenance.outputs.bundle-path }}" ]; then
            COMBINED="$COMBINED$(sha256sum ${{ steps.provenance.outputs.bundle-path }} | cut -d' ' -f1)"
          fi

          if [ -n "$COMBINED" ]; then
            DIGEST=$(echo -n "$COMBINED" | sha256sum | cut -d' ' -f1)
            echo "digest=sha256:$DIGEST" >> $GITHUB_OUTPUT
            echo "Attestation bundle digest: sha256:$DIGEST"
          else
            echo "digest=" >> $GITHUB_OUTPUT
            echo "No attestations generated"
          fi

      - name: Upload attestation artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # tag=v6.0.0
        with:
          name: attestations${{ inputs.artifact-prefix != '' && format('-{0}', inputs.artifact-prefix) || '' }}
          path: |
            provenance.json
            ${{ steps.provenance.outputs.bundle-path }}
          retention-days: 90
          if-no-files-found: ignore

      - name: Generate attestation summary
        if: always()
        run: |
          echo "## Attestation Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ inputs.registry }}/${{ inputs.image-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.digest.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Generated Attestations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "${{ steps.provenance.outputs.bundle-path }}" ]; then
            echo "✅ SLSA Provenance: Generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ SLSA Provenance: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "✅ SBOM (SPDX): Per-architecture SBOMs signed and attached" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.attest-scan.outcome }}" = "success" ]; then
            echo "✅ Vulnerability Scan Attestation: Attached" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Vulnerability Scan Attestation: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.attest-build-env.outcome }}" = "success" ]; then
            echo "✅ Build Environment Attestation: Attached" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Build Environment Attestation: Failed (non-critical)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "${{ inputs.custom-predicate-type }}" ]; then
            if [ "${{ steps.attest-custom.outcome }}" = "success" ]; then
              echo "✅ Custom Attestation: Attached" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Custom Attestation: Failed" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Attestation Bundle Digest:** \`${{ steps.attestation-digest.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>View verification commands</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Attestations are stored in the OCI registry in standard Sigstore format." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verify and download attestations using:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View all supply chain artifacts attached to the image:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cosign tree ${{ inputs.image-ref }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download SLSA provenance attestation from OCI registry:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cosign download attestation --predicate-type https://slsa.dev/provenance/v1 \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ inputs.image-ref }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download per-architecture SPDX SBOM attestations (BuildKit-generated):" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# View all SBOMs for all architectures" >> $GITHUB_STEP_SUMMARY
          echo "cosign download attestation --predicate-type https://spdx.dev/Document \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ inputs.image-ref }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download build environment attestation:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cosign download attestation --predicate-type https://github.com/felddy/reusable-workflows/build-environment/v1 \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ inputs.image-ref }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Extract SPDX SBOM content for a specific architecture:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# SBOMs are per-architecture; each platform has its own SBOM" >> $GITHUB_STEP_SUMMARY
          echo "cosign download attestation --predicate-type https://spdx.dev/Document \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ inputs.image-ref }} | jq -r '.dsseEnvelope.payload' | base64 -d | jq '.predicate'" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verify SLSA Provenance with cosign:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cosign verify-attestation --type https://slsa.dev/provenance/v1 \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-identity-regexp=\"^https://github.com/${{ github.repository }}\" \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-oidc-issuer=\"https://token.actions.githubusercontent.com\" \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ inputs.image-ref }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verify SBOM attestations with cosign:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cosign verify-attestation --type https://spdx.dev/Document \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-identity-regexp=\"^https://github.com/${{ github.repository }}\" \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-oidc-issuer=\"https://token.actions.githubusercontent.com\" \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ inputs.image-ref }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** BuildKit generates per-architecture SBOMs during the build process." >> $GITHUB_STEP_SUMMARY
          echo "This workflow downloads those SBOMs and re-uploads them as signed GitHub Actions attestations." >> $GITHUB_STEP_SUMMARY
          echo "All attestations (SLSA provenance, SBOMs, build environment, vulnerability scan) are now signed and cryptographically verifiable." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download all attestations using gh CLI:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "gh attestation download oci://${{ inputs.image-ref }} --owner ${{ github.repository_owner }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
