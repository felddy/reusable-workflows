---
name: CSV to JSON

# This workflow converts a comma-separated list of platforms to a JSON array.

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      csv:
        description: Comma-separated list
        required: true
        type: string
    outputs:
      json:
        description: JSON array
        value: ${{ jobs.convert.outputs.json }}

jobs:
  convert:
    name: Convert platforms CSV to JSON
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.csv-to-json.outputs.json }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # tag=v2.15.0
        with:
          egress-policy: block
          allowed-endpoints: >

      - name: Convert CSV to JSON
        id: csv-to-json
        run: |
          echo "json=$(echo -n ${{ inputs.csv }} | jq --raw-input --compact-output 'split(",")')" >> $GITHUB_OUTPUT
