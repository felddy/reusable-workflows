[pytest]
addopts = --capture=no --color=yes --runslow --verbose -rA

# Only the container test suite; the python-build dogfood fixture under
# src/python-library has its own pytest configuration.
testpaths = tests

log_cli = true
log_cli_level = INFO

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
